<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>FF風サイドビューバトルデモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#090a1a;
    --window-blue:#0018a8;
    --window-blue-dark:#000860;
    --paper:#f0f0e4;
    --gold:#f8d870;
    --hp-green:#58d858;
    --hp-yellow:#f8d870;
    --hp-red:#e85858;
    --mp-blue:#68a8f8;
    --sky-1:#6ec6f5;
    --sky-2:#bfe6ff;
    --sky-3:#eaf7ff;
    --ground-1:#3f7a2c;
    --ground-2:#336422;
    --ground-3:#274d1a;
    --ground-tex-a:#2f5e21;
    --ground-tex-b:#376a27;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:#000;
    font-family:'Noto Sans JP', sans-serif;
    image-rendering:pixelated;
    overflow:hidden;
  }
  #game{
    width:100%;
    aspect-ratio:4/3.4;
    max-width:960px;
    max-height:100vh;
    max-height:100dvh;
    margin:0 auto;
    background:
      linear-gradient(to bottom,
        var(--sky-1) 0%,
        var(--sky-2) 10%,
        var(--sky-3) 11%,
        var(--ground-1) 11%,
        var(--ground-2) 50%,
        var(--ground-3) 100%);
    position:relative;
    display:flex;
    flex-direction:column;
    border:4px solid #000;
    box-shadow:0 0 0 3px #3a3a5a, 0 0 40px rgba(0,0,0,.8);
    font-size:17px;
    user-select:none;
    overflow:hidden;
  }
  #game.terrain-desert{
    --sky-1:#c9642e;
    --sky-2:#b8443f;
    --sky-3:#d9a05a;
    --ground-1:#e0c07f;
    --ground-2:#c9a058;
    --ground-3:#a67c3d;
    --ground-tex-a:#d4af6a;
    --ground-tex-b:#e0bd7a;
  }
  #game.terrain-castle{
    --sky-1:#332c42;
    --sky-2:#241f30;
    --sky-3:#171320;
    --ground-1:#6b6b74;
    --ground-2:#54545c;
    --ground-3:#3a3a40;
    --ground-tex-a:#4a4a52;
    --ground-tex-b:#59595f;
  }
  #game::before{ /* ground texture: 8bit-style random noise tile (grassland) */
    content:"";
    position:absolute;
    left:0;right:0;
    top:11%;bottom:0;
    background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAABjElEQVR4nFVSvYqrQBg9KyrDjoHBKVKoEAJ2pvEBct/rPl4eIE22CwTBbJFCGXBcPsZmi7N32NvI/BzPd37m7c/fzj1XVeQAlMkAaKM+PyZV5OIDgLgwtQaQiNtMre1hJz5oowBMwwKg7fdkER+qzppa8zZVJmuO5f36IgEAe9itTsbHLD7wHw6kkATA/foC4J7rNCzaqNUJt6bWFHM6N8pkptbKZCkHidtIPw2L+HA6N9qoaVhMrcVt8/wVAenqRNymTGYPu4i+X1/kFh9MrTmTCpPmWNJGvB4fszKZKnK6EreJ29p+X3UWQEoyCqPFaCBG6Z4rYVVnU3vYRelVZ8vy/XYZmUlEqyJnRQBSQpnA58c0Fcvp3IyP+UfMv2RjJAnR4jZtVNVZ8YEpiw+cGblZbhoznYaFYTfHkqqI4xwuVJEnqshpg1/3XAFUnW37PU+oKqacAijL92lYfgopcp7QBh23/Z5bZbJEfOBGGyU+tP3+dhlvl5F6yP1f078fNoDxMf9Wzyr4+FjuN6r0F/U7+ARLAAAAAElFTkSuQmCC);
    background-size:48px 48px;
    background-repeat:repeat;
    image-rendering:pixelated;
    opacity:.8;
    box-shadow:inset 0 4px 0 rgba(255,255,255,.1);
    pointer-events:none;
    z-index:0;
  }
  #game.terrain-desert::before{ /* 8bit-style random noise tile (sand) */
    background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAABqElEQVR4nD1SvYrqQBT+EtIlGIlFhJDCjJ0oATshhY1PYOEz7CMs+zBbLbe4cPsLS4qBwBaC6Npl4kIYMMVKDLG/xXd3pjjMnDnnfD8z1ttLJqYRAJFm/bcG0NSVKvVqnfVdC2A8mV0v5+P+tFpnTV1Zn3+expPZ39+/AABYLOeP+831AwDcMHqDIYAil87jflMHCYAjH/dbGCfcqFIDerXOAPRd6w2Gi+XcVqVWpSYrbzAM44SzCcjqpq44fjyZWV/vz94oIvsil6Rk9LA6jJMil2x22M1IWarUgAQQxok3ipq66rtWTCNvFF0vZ1ukWZFLkWaq1N4ows9y/aCpq+vlbHRTqvX2km22u+vlTA1GLrkRh0kOcsQ0UgdJ3ePJrO/aME7M1OP+ZABphvXxumOK/hS55GvwmkmDoEptm+oil01dLZZzWszVd22RS9pNFrYqtUj//wLKMFGkGYDNdsfOxXLu+oH19f7MVzTmkjENIDHzsgCcvmuP+5OYRq4fUCXvTDM9MLCO8YvnzXanDpJ7jmcnQVw/sI2+Ipd91/LbEpZ1ppr9/wBB2R7ufS66CQAAAABJRU5ErkJggg==);
    background-size:48px 48px;
    background-repeat:repeat;
    image-rendering:pixelated;
    opacity:.85;
  }
  #game.terrain-castle::before{ /* 8bit-style random noise tile (stone) */
    background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAABmklEQVR4nF1Su2rrQBAdi1TbZORGZlGxjsAEQYjWqEplQ/IHKfMlqe/fuFGfgP0BIQ4EzCVw4xRisRpp3Eyd4iSLuVsN8zhnzpkd3d8/qKoxhohCaEUGInKuqKr529sr8nhZNtluX0Zlec2cEpG1uaqK9NbmGD4NZrPLzeZZZEiYU2tz72vwgOEU1do8hBaIzhVnzGNV3e8/UQbkYnGLga47qOopVRLBjDHb7Qsgm2aVZZMQWtCqatOsvK9DaEc3NwtsP51edN0BupfLu/X6qSyvoh9EhPhHNBZlHp8SogMC4kucK6Is9FXV/NfiPuZFBsAlVTWPsqbTC1U9HoWImMfoEBm8r50rjDHM46RpVsaY3e6diPb7T5H+/JxFemOMMcbanDmFh9A5enz8s9k8gyGeE65jn3h7IhLpf1yKJmTZpOsOcRjYMb/bvZ/99wtiHLu/vv4BjoiY00RkiHf1vkYcQrteP+ECZXm1XN6J9Ngzca5omhUAuu5wPApMY06zbIJrgIqIZrPLJH7mWBPpMQMxwPa+JqKPj7/f3ZAMjq6otq8AAAAASUVORK5CYII=);
    background-size:40px 40px;
    background-repeat:repeat;
    image-rendering:pixelated;
    opacity:.85;
  }
  @media (max-width:700px){
    #game{font-size:13px; aspect-ratio:3/5; max-height:100dvh;}
  }
  @media (max-width:480px){
    #game{aspect-ratio:9/17;}
  }

  /* ---------- battlefield ---------- */
  #battlefield{
    flex:1;
    position:relative;
    background:transparent;
    overflow:hidden;
    z-index:1;
  }
  #stars{display:none;}
  #clouds{
    position:absolute;
    left:0; right:0;
    top:0; height:11%;
    overflow:hidden;
    pointer-events:none;
    z-index:1;
  }
  .cloud{
    position:absolute;
    image-rendering:pixelated;
    background-repeat:no-repeat;
    background-size:100% 100%;
    opacity:.92;
  }
  .cloud-a{
    width:64px; height:29px;
    background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAASCAYAAAApH5ymAAAAd0lEQVR4nGNgGAXDHDBSy6BpWy79J0dflo8e1dyAE0zbcuk/uYCQx1iIsZx6XiEd4HXgtC2X/md669LLLVgBwRCkB0COJZLSJCVpi1ppEiMEBzrNoQMUBw6GNIcOmAbaAYTAqAMpBaMOpBRgFIoDXczQpfFATQAAZRPOEwNGrQcAAAAASUVORK5CYII=);
  }
  .cloud-b{
    width:44px; height:24px;
    background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABoAAAAOCAYAAAAxDQxDAAAAWElEQVR4nGNgGG6AkRxN07Zc+k9ITZaPHorZLOQYlOmtS9g1Wy79R7YMw6JpWy79J8ogEgET1U3EAeA+IibcKbaIVsGFDOgWdKMWkQ3gGYraqQ69ZKAbAAANCRqWt26yTwAAAABJRU5ErkJggg==);
  }
  .c1{ top:8%;  left:-15%; animation:driftCloud 42s linear infinite; }
  .c2{ top:45%; left:-15%; animation:driftCloud 58s linear infinite; animation-delay:-18s; }
  .c3{ top:20%; left:-15%; animation:driftCloudFlip 50s linear infinite; animation-delay:-30s; }
  .c4{ top:62%; left:-15%; animation:driftCloud 65s linear infinite; animation-delay:-8s; }
  @keyframes driftCloud{
    from{ transform:translateX(0); }
    to{ transform:translateX(115vw); }
  }
  @keyframes driftCloudFlip{
    from{ transform:translateX(0) scaleX(-1); }
    to{ transform:translateX(115vw) scaleX(-1); }
  }

  #aura{
    position:absolute;
    left:0; right:0;
    top:0; height:15.1%;
    overflow:hidden;
    pointer-events:none;
    z-index:1;
    display:none;
  }
  #game.terrain-castle #aura{
    display:block;
    background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAYCAYAAACIhL/AAAAArklEQVR4nNXWvQ2AIBiE4VcSN7C2tmYc53AM5nAC56C2dg0bG0wMfqgd55X8JE8uEGhCt2DFDz5Y43GNk7khZdu38Wn+TN/285d17suimjGBKu2BAVTCQQZUw8EFqIiDBFTFAThlHBRusQrODz7cgEo4yBpUw8GfXhLF9iABVXEATek3c6YmDl7OYG1cXONUBCrgoNCgCg4MoBIOMqAaDi5ARRz85SVRbQ/AKeMADrmkp+8Y2lcEAAAAAElFTkSuQmCC);
    background-repeat:repeat;
    background-size:40px 100%;
    image-rendering:pixelated;
    animation:auraScroll 1.1s linear infinite;
    mix-blend-mode:screen;
  }
  #game.terrain-castle #aura::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse at 50% 40%, rgba(200,60,255,.35), transparent 70%);
    animation:auraPulse 1.8s ease-in-out infinite;
  }
  #game.terrain-castle #clouds{ display:none; }

  #horizon-scenery{
    position:absolute;
    left:0; right:0;
    top:9%; height:10%;
    background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAAAeCAYAAADTsBuJAAAB7ElEQVR4nO1ZsW3DMBD8sAhSGoGgQhMEWcCBR3GVwrXLwCMEgatM4AEyRJBKE2QK7aBUNCSG5D/Jf1JMdKVIHu///knCvoEC2B/OfdM0AADw/vr8VELDUqBKC6gFx9Oll+DNbsD+cJ4FIhVYLVg7gABdNBLFghrAualZ/RJ71Ia1AxBwH5nmeq8BnK3nqn6XsP8CpwG1XZYS+riPTFtBZzmCsOrXWJLJ3B3rKmirAbVdlpKvFA748vnLAGnnMXBVVgpydqyaktR2VNTQqVhOFYCc4NDq16DokXpVcXYshet6BIUKLlllUp3KWTBUrqRXUKr7MdzSd0puzAzQPxEvFa7kf36/bX3rOI40DDF3KYClA0JNSGm/EG6pjuJGiM6Pr5etMj8A8JjACQlDqfy+7tL58vFg3em8A2wmmBtOcTxd+m7XjliyQgICmAeFBUPhNE3odu0YymnDMAxxC6cCMDGp49icWH4JTg5u35z7x83Y7dpRTT9QSZeEUrop+1LmkJ+hGBmXIM61qZpzmKukN6Ci1g6MgY4VwNEBZhKmC2LGqXM4waE5ljuEv4q/JF3B5DZVAlcD7ja31glmkBquJJjjMRypiZTQHLI2RJuzA5ZSTakBl0C05ofOvpBrHJsTyy/BycHNsX7Fir+NH9XPZPd8pabjAAAAAElFTkSuQmCC);
    background-repeat:repeat-x;
    background-position:bottom left;
    background-size:auto 100%;
    image-rendering:pixelated;
    z-index:1;
    pointer-events:none;
    opacity:.9;
  }
  #game.terrain-desert #horizon-scenery{
    background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAAAeCAYAAADTsBuJAAABDUlEQVR4nO3UvQ3CMBCG4TNiBIQomIGamgEQQzAARcagYACGQAxATc0MFAgxBAWyZEX5wfHZn5N8T4ks47sXIUJERGNlqj68H/e30IvXxXkTescQtO3S/HNIw5iC+OzTpFh+2dBihOwQEsDV5xgau4MHsPoSQntf5nLYPkREFsv5R/PiEF1i2Dl87U7XVduZmD9SU/fwXII0xei69CZukBT/DrUBrFxCiPxixFh6lVRztwZwIWO8nu8Z6rtjzj31OWyXkCoEcumumHN7BbDcxcR4VC6LL4sxd6cALo1H5brwJlpzBwcoX6h5X1+EzD3RfAj5YwAwBgBjADAGAGMAMAYAYwAwBgBjACKi8foCcilwEE6Lq8AAAAAASUVORK5CYII=);
  }
  #game.terrain-castle #horizon-scenery{
    display:none;
  }
  @keyframes auraScroll{
    from{ background-position:0 0; }
    to{ background-position:-40px 0; }
  }
  @keyframes auraPulse{
    0%,100%{ opacity:.5; }
    50%{ opacity:1; }
  }

  #reload-btn, #mute-btn{
    position:absolute;
    left:6px;
    width:28px; height:28px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.6);
    background-color:rgba(0,0,0,.25);
    background-repeat:no-repeat;
    background-position:center;
    background-size:16px 16px;
    image-rendering:pixelated;
    cursor:pointer;
    z-index:25;
    transition:background-color .15s ease, transform .15s ease;
  }
  #reload-btn{
    top:6px;
    background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAUCAYAAACNiR0NAAAAkElEQVR4nN2UTRKAIAiFsWmv27r/2XQLJ6iVDaHgT02Lvh2jPnkIAvwG77fDijOuVwQxQgg7yJgomRo3sR5kposmhhi7LpYU6UoxbrOGaVna1ApvUbWcM+suOGMdPcDhDorLR+1q+y/LRMm1HkCDl0et4SyqIGJUx8vq06k+lOvNbpgdu0eir/82M02vin/KCdSz1LXaPTIWAAAAAElFTkSuQmCC);
  }
  #reload-btn:hover{background-color:rgba(0,0,0,.45); transform:rotate(60deg);}
  #mute-btn{
    top:40px;
    background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAUCAYAAACNiR0NAAAAaklEQVR4nGNgGBaAn1/yPz+/5H+qGQYDxBjKRBVbiQXIriPWlfRzITbXEeNK+rgQn+sIuZL2LiTGdUSnS1IMw2UoE7JhHz48o9iHjOguxKYIZpGAgBSG3MePzxkxBPEBUvMy0YZSzbDhBwAz9dAkHIl4FQAAAABJRU5ErkJggg==);
  }
  #mute-btn:hover{background-color:rgba(0,0,0,.45);}
  #mute-btn.muted{
    background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAUCAYAAACNiR0NAAAAjElEQVR4nK2TQQ7AIAgEt/0AXu3/39Ze9QX0ZEIbsGDZm1GGSUAgKUSVmZlTYW4gUWWiqj6WMOuNu0C7212KRqPWTgBAKQd6v7aQnTSZWS8Zhs0su7epVrdkGDLz2KUbhuKx+7JcglnQXcLGOvzJY1Kjm9wz7Swznbb2A8KffwaTd2mwcFJhAJAKA3ADLsNHRxGNPzsAAAAASUVORK5CYII=);
    border-color:rgba(255,120,120,.7);
  }
  .star{position:absolute;width:2px;height:2px;background:#fff;opacity:.6;animation:twinkle 2.4s infinite ease-in-out;}
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.8;}}

  #enemy-row{
    position:absolute;
    left:5%;
    top:18%;
    bottom:2%;
    width:26%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-evenly;
    gap:1%;
  }
  #party-row{
    position:absolute;
    right:5%;
    top:18%;
    bottom:2%;
    width:22%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-evenly;
    gap:1%;
  }

  .unit{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:transform .18s ease;
    cursor:default;
  }
  .unit .shadow{
    width:70%;
    height:9px;
    background:rgba(0,0,0,.5);
    border-radius:50%;
    margin-top:2px;
    filter:blur(1px);
  }
  .unit.targetable{cursor:pointer;}
  .unit.targetable:hover .sprite, .unit.selected-target .sprite{
    filter:drop-shadow(0 0 6px var(--gold)) brightness(1.25);
  }
  .unit.dead{opacity:.25;filter:grayscale(1);}
  .unit .hpbar-mini{
    width:56px;
    max-width:70%;
    height:6px;
    background:#111;
    border:1px solid #000;
    margin-top:4px;
    box-shadow:0 0 0 1px #4a4a6a;
  }
  .unit .hpbar-mini > div{height:100%;background:var(--hp-green);transition:width .35s ease;}
  .unit .enemy-name-tag{
    font-size:.95em;
    color:#fff;
    margin-top:2px;
    text-shadow:1px 1px 0 #000;
  }

  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  @keyframes lungeRight{0%{transform:translateX(0);}45%{transform:translateX(60px) scale(1.05);}55%{transform:translateX(60px) scale(1.05);}100%{transform:translateX(0);}}
  @keyframes lungeLeft{0%{transform:translateX(0);}45%{transform:translateX(-60px) scale(1.05);}55%{transform:translateX(-60px) scale(1.05);}100%{transform:translateX(0);}}
  @keyframes flashHit{0%,100%{filter:none;}30%{filter:brightness(3) saturate(0) drop-shadow(0 0 8px #fff);}60%{filter:brightness(0.2) sepia(1) saturate(6) hue-rotate(-40deg);}}
  @keyframes shakeSmall{0%,100%{transform:translateX(0);}20%{transform:translateX(-4px);}40%{transform:translateX(4px);}60%{transform:translateX(-3px);}80%{transform:translateX(3px);}}
  @keyframes castGlow{0%,100%{filter:none;}50%{filter:brightness(1.8) drop-shadow(0 0 10px var(--cast-color, #b0e0ff));}}
  .impact-burst{
    position:absolute;
    left:50%; top:42%;
    width:10px;height:10px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:18;
    animation:burstPop .5s ease forwards;
  }
  @keyframes burstPop{
    0%{ opacity:.95; width:8px; height:8px; box-shadow:0 0 0 0 currentColor;}
    100%{ opacity:0; width:var(--burst-size,64px); height:var(--burst-size,64px); box-shadow:0 0 26px 8px currentColor;}
  }
  .impact-particle{
    position:absolute;
    left:50%; top:42%;
    width:7px;height:7px;
    border-radius:50%;
    background:currentColor;
    pointer-events:none;
    z-index:19;
    animation:particleFly .55s ease-out forwards;
  }
  @keyframes particleFly{
    0%{ transform:translate(-50%,-50%) translate(0,0) scale(1); opacity:1;}
    100%{ transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.25); opacity:0;}
  }
  .slash-mark{
    position:absolute;
    left:50%; top:42%;
    width:5px;
    background:linear-gradient(to bottom, transparent, currentColor 20%, currentColor 80%, transparent);
    pointer-events:none;
    z-index:20;
    opacity:0;
    box-shadow:0 0 10px 2px currentColor;
    animation:slashSweep .6s ease-out forwards;
  }
  @keyframes slashSweep{
    0%{ opacity:0; transform:translate(-50%,-50%) rotate(var(--slash-angle,-30deg)) scaleY(.1) scaleX(1.6);}
    28%{ opacity:1; transform:translate(-50%,-50%) rotate(var(--slash-angle,-30deg)) scaleY(1) scaleX(1);}
    100%{ opacity:0; transform:translate(-50%,-50%) rotate(var(--slash-angle,-30deg)) scaleY(1) scaleX(1);}
  }
  .turn-arrow{
    position:absolute;
    top:-1.05em;
    left:50%;
    transform:translateX(-50%);
    font-size:1.4em;
    color:#fff;
    text-shadow:1px 1px 0 #000, -1px -1px 0 #000;
    opacity:0;
    pointer-events:none;
    z-index:5;
  }
  .turn-arrow.show{
    animation:arrowBlink 1.4s ease-in-out infinite;
  }
  @keyframes arrowBlink{0%,100%{opacity:1;}50%{opacity:.1;}}
  .target-hover-arrow{
    position:absolute;
    top:-1.05em;
    left:50%;
    transform:translateX(-50%);
    font-size:1.4em;
    color:#fff;
    text-shadow:1px 1px 0 #000, -1px -1px 0 #000;
    opacity:0;
    pointer-events:none;
    z-index:6;
    transition:opacity .1s ease;
  }
  .unit.selected-target .target-hover-arrow{opacity:1;}
  .unit.targetable:hover .target-hover-arrow{opacity:1;}
  @keyframes fadeOutUnit{to{opacity:0;transform:translateY(10px) scale(.85) rotate(8deg);}}

  .lunge-wrap{display:flex;flex-direction:column;align-items:center;}
  .unit.idle .sprite{}
  .unit.attack-right .lunge-wrap{animation:lungeRight .5s ease;}
  .unit.attack-left .lunge-wrap{animation:lungeLeft .5s ease;}
  .unit.attack-right-hold .lunge-wrap{transform:translateX(60px);transition:transform .22s ease;}
  .unit.attack-left-hold .lunge-wrap{transform:translateX(-60px);transition:transform .22s ease;}
  .unit.attack-right-hold .sprite{transform:scale(1.05);transition:transform .22s ease;}
  .unit.attack-left-hold .sprite{transform:scale(1.05);transition:transform .22s ease;}
  .unit.hit .sprite{animation:flashHit .45s ease;}
  .unit.shake{animation:shakeSmall .4s ease;}
  .unit.casting .sprite{animation:castGlow .6s ease 2;}
  .unit.fading{animation:fadeOutUnit .6s forwards;}

  .sprite{position:relative;}
  .sprite-sheet{
    width:5.175em;
    height:5.175em;
    background-image:var(--party-sheet-url);
    background-size:400% 400%;
    background-repeat:no-repeat;
    image-rendering:auto;
    filter:drop-shadow(1px 2px 1px rgba(0,0,0,.4));
  }

  /* pixel sprites built from stacked divs (box-shadow pixel grid) */
  .px{
    width:4px;height:4px;
    position:absolute;
    box-shadow: var(--pixels);
  }

  /* floating damage / heal numbers */
  .dmg-pop{
    position:absolute;
    left:50%;top:-6px;
    transform:translateX(-50%);
    font-family:'Press Start 2P',monospace;
    font-size:26px;
    color:#fff;
    text-shadow:2px 2px 0 #000, -1px -1px 0 #000;
    pointer-events:none;
    animation:popUp 1s ease forwards;
    z-index:20;
  }
  .dmg-pop.heal{color:#8cffb0;}
  .dmg-pop.mpheal{color:#68a8f8;}
  .dmg-pop.miss{color:#cfcfe8;}
  @keyframes popUp{
    0%{opacity:0;transform:translate(-50%,6px) scale(.7);}
    15%{opacity:1;transform:translate(-50%,-14px) scale(1.15);}
    75%{opacity:1;transform:translate(-50%,-30px) scale(1);}
    100%{opacity:0;transform:translate(-50%,-40px) scale(1);}
  }

  #flash-overlay{
    position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30;
  }
  .flash-on{animation:screenFlash .18s ease;}
  @keyframes screenFlash{0%{opacity:.75;}100%{opacity:0;}}

  /* ---------- bottom UI ---------- */
  #ui-bottom{
    height:27%;
    display:flex;
    flex-direction:column;
    background:transparent;
    padding:6px;
    gap:6px;
    position:relative;
    z-index:1;
  }
  .window{
    background:linear-gradient(#0b1470,#050a3c);
    border:3px solid var(--paper);
    box-shadow:inset 0 0 0 2px var(--window-blue-dark), 0 2px 0 rgba(0,0,0,.4);
    border-radius:2px;
    color:var(--paper);
    padding:8px 10px;
  }
  #message-window{
    position:absolute;
    left:6px;
    right:6px;
    bottom:3%;
    height:8.5%;
    font-size:1.05em;
    line-height:1.3;
    display:flex;
    align-items:center;
    letter-spacing:.02em;
    z-index:15;
  }
  #message-window span.blinker{
    display:inline-block;
    margin-left:8px;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  #lower-panels{
    flex:1;
    display:flex;
    gap:6px;
    min-height:0;
  }
  #command-window{
    flex:0 0 32%;
    display:flex;
    flex-direction:column;
    gap:2px;
    font-size:1.05em;
    overflow-y:auto;
  }
  #command-window .cmd-title{
    color:var(--gold);
    font-size:.85em;
    margin-bottom:4px;
    text-shadow:1px 1px 0 #000;
  }
  .cmd-item{
    display:flex;align-items:center;gap:6px;
    padding:3px 4px;cursor:pointer;
    border-radius:2px;
  }
  .cmd-item .cursor{
    width:10px;color:#fff;opacity:0;
  }
  .cmd-item.active .cursor{opacity:1;animation:blink .6s steps(1) infinite;}
  .cmd-item.disabled{opacity:.35;cursor:default;}

  #status-window{
    flex:1;
    display:grid;
    grid-template-columns:1fr;
    gap:1px;
    font-size:1.05em;
    overflow-y:auto;
    overflow-x:auto;
  }
  .status-row{
    display:grid;
    grid-template-columns:100px 1fr 1fr;
    align-items:center;
    gap:3px;
    padding:1.5px 3px;
    border-radius:2px;
  }
  .status-row .nm{
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;gap:4px;
  }
  .status-row.ko .nm{color:#8888a8;text-decoration:line-through;}
  .bar-wrap{display:flex;align-items:center;justify-content:flex-end;gap:5px;}
  .bar-track{width:38px;flex:0 0 auto;height:9px;background:#000;border:1px solid #050a3c;box-shadow:0 0 0 1px #5060c0;}
  .bar-track > div{height:100%;}
  .hp-fill{background:linear-gradient(#7cf07c,var(--hp-green));}
  .hp-fill.mid{background:linear-gradient(#f8e888,var(--hp-yellow));}
  .hp-fill.low{background:linear-gradient(#f89898,var(--hp-red));}
  .mp-fill{background:linear-gradient(#a8d0ff,var(--mp-blue));}
  .num{font-family:'Press Start 2P',monospace;font-size:.68em;color:#dfe4ff;text-align:left;white-space:pre;}

  #target-window{
    flex:0 0 34%;
    display:flex;flex-direction:column;gap:2px;font-size:1.05em;overflow-y:auto;
  }
  #target-window .cmd-item{
    display:block;
    position:relative;
    padding-left:20px;
    text-align:left;
  }
  #target-window .cmd-item .cursor{
    position:absolute;
    left:0;
    top:50%;
    transform:translateY(-50%);
  }
  #target-window .cmd-item > span:last-child{
    display:block;
    text-align:left;
  }

  .hidden{display:none !important;}

  #end-overlay{
    position:absolute;inset:0;
    background:rgba(0,0,0,.82);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;color:var(--paper);text-align:center;z-index:50;
  }
  #end-overlay h2{
    font-family:'Press Start 2P',monospace;
    font-size:1.4em;color:var(--gold);
    text-shadow:2px 2px 0 #000;
    letter-spacing:.05em;
  }
  #end-overlay button{
    font-family:'Noto Sans JP',sans-serif;
    font-size:1em;
    background:var(--window-blue);
    color:#fff;
    border:2px solid var(--paper);
    padding:10px 22px;
    cursor:pointer;
    border-radius:2px;
  }
  #end-overlay button:hover{background:#1a2ac8;}
  #end-overlay p{max-width:70%;line-height:1.6;color:#dfe4ff;font-size:.9em;white-space:pre-line;}

  #party-select-overlay{
    position:absolute;inset:0;
    background:rgba(0,0,0,.9);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;color:var(--paper);text-align:center;z-index:60;
    padding:4% 3%;
  }
  #party-select-overlay h2{
    font-family:'Press Start 2P',monospace;
    font-size:1.2em;color:var(--gold);
    text-shadow:2px 2px 0 #000;
    letter-spacing:.05em;
  }
  .party-select-note{
    font-size:.8em;color:#cfd6ff;max-width:85%;line-height:1.5;margin:0 0 4px;
  }
  #party-slots{
    display:flex;
    flex-direction:column;
    gap:6px;
    width:92%;
    max-width:420px;
  }
  .party-slot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(#0b1470,#050a3c);
    border:2px solid var(--paper);
    border-radius:4px;
    padding:6px 8px;
  }
  .party-slot .slot-label{
    font-size:.75em;color:#b8c0ff;width:20%;text-align:left;
  }
  .party-slot .slot-preview{
    display:flex;align-items:center;gap:8px;flex:1;justify-content:center;
  }
  .party-slot .slot-sprite{
    width:2.4em;height:2.4em;
    background-image:var(--party-sheet-url);
    background-size:400% 400%;
    image-rendering:auto;
    flex:0 0 auto;
  }
  .party-slot .slot-name{
    font-size:.85em;min-width:6.5em;text-align:left;
  }
  .party-slot button{
    font-family:'Noto Sans JP',sans-serif;
    font-size:1.1em;
    background:var(--window-blue);
    color:#fff;
    border:2px solid var(--paper);
    width:1.8em;height:1.8em;
    line-height:1;
    cursor:pointer;
    border-radius:3px;
  }
  .party-slot button:hover{background:#1a2ac8;}
  #party-confirm-btn{
    font-family:'Noto Sans JP',sans-serif;
    font-size:1em;
    background:var(--window-blue);
    color:#fff;
    border:2px solid var(--paper);
    padding:10px 26px;
    cursor:pointer;
    border-radius:2px;
    margin-top:8px;
  }
  #party-confirm-btn:hover{background:#1a2ac8;}
</style>

const PARTY_SHEET_COLS = 4;
const PARTY_SHEET_ROWS = 4;
const PARTY_SHEET_MAP = {
  fighter:{col:0,row:0},
  mage:{col:1,row:0},
  priest:{col:2,row:0},
  monk:{col:3,row:0},
  knight:{col:0,row:1},
  blackmage:{col:1,row:1},
  whitemage:{col:2,row:1},
  supermonk:{col:3,row:1}
};
document.documentElement.style.setProperty('--party-sheet-url', `url(${PARTY_SHEET})`);

function buildSpriteEl(kind, pxSize){
  if(PARTY_SHEET_MAP[kind]){
    const {col,row} = PARTY_SHEET_MAP[kind];
    const wrap = document.createElement('div');
    wrap.className = 'sprite sprite-sheet';
    const posX = PARTY_SHEET_COLS>1 ? (col/(PARTY_SHEET_COLS-1))*100 : 0;
    const posY = PARTY_SHEET_ROWS>1 ? (row/(PARTY_SHEET_ROWS-1))*100 : 0;
    wrap.style.backgroundPosition = posX + '% ' + posY + '%';
    return wrap;
  }
  const pattern = SPRITES[kind];
  const palette = PALETTES[kind];
  const rows = pattern.length;
  const cols = Math.max(...pattern.map(r=>r.length));
  const wrap = document.createElement('div');
  wrap.className = 'sprite';
  wrap.style.width = (cols*pxSize)+'px';
  wrap.style.height = (rows*pxSize)+'px';
  let shadows = [];
  for(let y=0;y<rows;y++){
    const row = pattern[y];
    for(let x=0;x<cols;x++){
      const ch = row[x];
      if(ch && ch!=='.' && palette[ch]){
        shadows.push(`${x*pxSize}px ${y*pxSize}px 0 0 ${palette[ch]}`);
      }
    }
  }
  const px = document.createElement('div');
  px.className='px';
  px.style.setProperty('--pixels', shadows.join(','));
  px.style.left='0';px.style.top='0';
  wrap.appendChild(px);
  return wrap;
}

function makeChar(id,name,kind,hp,mp,atk,def,spd,spells,techniques){
  return {id,name,kind,hp,maxHp:hp,mp,maxMp:mp,atk,def,spd,spells:spells||[],techniques:techniques||[],evolved:false,alive:true,isEnemy:false};
}
function makeEnemy(id,name,kind,hp,atk,def,spd,gold,exp){
  return {id,name,kind,hp,maxHp:hp,atk,def,spd,gold,exp,alive:true,isEnemy:true};
}
function makeBoss(id,name,kind,hp,atk,def,spd,abilities){
  return {id,name,kind,hp,maxHp:hp,atk,def,spd,mp:999,maxMp:999,gold:0,exp:0,alive:true,isEnemy:true,abilities};
}

function buildPartyMember(idx, job){
  const def = JOB_DEFS[job];
  return makeChar('p'+idx, def.name, job, def.hp, def.mp, def.atk, def.def, def.spd,
    def.spells.map(s=>({...s})), def.techniques.map(t=>({...t})));

function buildPartyFromSelection(selection){
  return selection.map((job,i)=>buildPartyMember(i, job));
}

function applyJobSkills(p){
  switch(p.kind){
    case 'knight':
      p.maxMp = Math.max(p.maxMp, 8); p.mp = p.maxMp;
      p.techniques = (p.techniques||[]).concat([
        {name:'十字斬り',mp:6,mult:1.89,type:'tech-atk-single'}
      ]);
      break;
    case 'blackmage':
      p.maxMp += 6; p.mp = p.maxMp;
      p.spells = (p.spells||[]).concat([
        {name:'メテオ',mp:16,power:19,type:'atk-all'},
        {name:'フレア',mp:20,power:29,type:'atk-single'}
      ]);
      break;
    case 'whitemage':
      p.maxMp += 6; p.mp = p.maxMp;
      p.spells = (p.spells||[]).concat([
        {name:'ケアルガ',mp:12,power:22,type:'heal-all'},
        {name:'プロテガ',mp:12,power:4,type:'buff-def-all'},
        {name:'ホーリー',mp:10,power:24,type:'atk-single'}
      ]);
      break;
    case 'supermonk':
      p.maxMp = 12; p.mp = p.maxMp;
      p.techniques = (p.techniques||[]).concat([
        {name:'回し蹴り',mp:4,mult:1.2,type:'tech-atk-all'},
        {name:'爆裂拳',mp:12,mult:3.12,type:'tech-atk-single'}
      ]);
      break;
  }
}

function classChangeParty(){
  const changed = [];
  state.party.forEach(p=>{
    const eve = EVOLUTION[p.kind];
    if(!eve || p.evolved) return;
    const oldName = p.name;
    p.kind = eve.kind;
    p.name = eve.name;
    p.evolved = true;
    applyJobSkills(p);
    changed.push({from:oldName, to:eve.name});
  });
  if(changed.length){
    renderUnits();
    renderStatus();
  }
  return changed;
}

function randomEncounter(round){
  const n = Math.min(4, 2 + Math.floor(Math.random()*2) + (round>2?1:0));
  const list = [];
  const pool = round>=3 ? ENEMY_POOL : ENEMY_POOL.slice(0,3);
  for(let i=0;i<n;i++){
    const maker = pool[Math.floor(Math.random()*pool.length)];
    const e = maker();
    e.id = e.id+'_'+i;
    list.push(e);
  }
  return list;
}

/* ---------- sound effects (synthesized, no audio files needed) ---------- */
let audioCtx = null;
let audioMuted = false;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(audioCtx.state==='suspended'){
    audioCtx.resume().then(()=>{
      if(typeof pendingBGMStart!=='undefined' && pendingBGMStart){
        const fn = pendingBGMStart;
        pendingBGMStart = null;
        fn();
      }
    }).catch(()=>{});
  }
  return audioCtx;
}
function playTone(freq, duration, type, volume, delay){
  if(audioMuted) return;
  const ctx = getAudioCtx();
  if(!ctx) return;
  const startAt = ctx.currentTime + (delay||0);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, startAt);
  gain.gain.setValueAtTime(0, startAt);
  gain.gain.linearRampToValueAtTime(volume||0.16, startAt+0.008);
  gain.gain.exponentialRampToValueAtTime(0.001, startAt+(duration||0.09));
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(startAt);
  osc.stop(startAt+(duration||0.09)+0.02);
}

function scheduleTone(freq, startTime, duration, type, vol){
  if(audioMuted) return;
  const ctx = getAudioCtx();
  if(!ctx || !freq) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(vol, startTime+0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime+duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime+duration+0.02);
}

function scheduleSnare(startTime){
  if(audioMuted) return;
  const ctx = getAudioCtx();
  if(!ctx) return;
  const bufferSize = Math.floor(ctx.sampleRate*0.06);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.setValueAtTime(1800, startTime);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.14, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime+0.07);
  noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  noise.start(startTime); noise.stop(startTime+0.08);
}

function musicScheduler(){
  const ctx = getAudioCtx();
  if(!ctx || !music.playing) return;
  while(music.nextStepTime < ctx.currentTime + 0.12){
    const i = music.step % music.bass.length;
    scheduleTone(music.bass[i], music.nextStepTime, music.stepDur*0.9, 'square', music.bassVol);
    if(music.melody.length && i % 4 === 0){
      const mi = Math.floor(i/4) % music.melody.length;
      scheduleTone(music.melody[mi], music.nextStepTime, music.stepDur*3.6, 'square', music.leadVol);
    }
    if(i % 8 === 4){
      scheduleSnare(music.nextStepTime);
    }
    music.nextStepTime += music.stepDur;
    music.step++;
  }
}

let pendingBGMStart = null;
function requestBGM(fn){
  const ctx = getAudioCtx();
  if(ctx && ctx.state==='running'){
    pendingBGMStart = null;
    fn();
  } else {
    pendingBGMStart = fn;
  }
}

function playVictoryFanfare(){
  stopBGM();
  const ctx = getAudioCtx();
  if(!ctx) return;
  const t = ctx.currentTime + 0.05;

  // 冒頭のドラマチックな一打
  scheduleSnare(t);

  // 上昇するファンファーレ
  const flourish = [523.25, 659.25, 783.99, 1046.50];
  flourish.forEach((f,i)=>{
    scheduleTone(f, t+i*0.11, 0.13, 'square', 0.17);
    scheduleTone(f/2, t+i*0.11, 0.13, 'triangle', 0.08);
  });

  // 力強い和音
  const chordTime = t + flourish.length*0.11 + 0.05;
  [523.25, 659.25, 783.99].forEach(f=>{
    scheduleTone(f, chordTime, 0.5, 'square', 0.14);
    scheduleTone(f/2, chordTime, 0.5, 'triangle', 0.09);
  });
  scheduleSnare(chordTime);

  // 締めくくりの大きな和音
  const finalTime = chordTime + 0.62;
  scheduleSnare(finalTime);
  [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50].forEach(f=>{
    scheduleTone(f, finalTime, 1.15, 'square', 0.1);
  });
}

function sfxSlash(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const t = ctx.currentTime;
  const bufferSize = Math.floor(ctx.sampleRate*0.16);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){
    data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 1.5);
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.setValueAtTime(3400, t);
  filter.frequency.exponentialRampToValueAtTime(700, t+0.16);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.28, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t+0.17);
  noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  noise.start(t); noise.stop(t+0.18);
}

function sfxImpactThud(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(220, t);
  osc.frequency.exponentialRampToValueAtTime(70, t+0.16);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.001, t);
  gain.gain.linearRampToValueAtTime(0.5, t+0.012);
  gain.gain.exponentialRampToValueAtTime(0.001, t+0.2);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.22);

  const bufferSize = Math.max(1, Math.floor(ctx.sampleRate*0.03));
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){
    data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(0.3, t);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, t+0.04);
  noise.connect(noiseGain); noiseGain.connect(ctx.destination);
  noise.start(t);
}

function pad3(n){
  const s = String(n);
  return s.length>=3 ? s : s + '\u00A0'.repeat(3-s.length);
}

function renderStatus(){
  el.statusWindow.innerHTML='';
  const list = state.targetSelectMode
    ? state.party.map((p,i)=>({p,i})).filter(({i})=>i===state.turnIndex)
    : state.party.map((p,i)=>({p,i}));
  list.forEach(({p,i})=>{
    const isActing = (state.phase!=='resolving' && i===state.turnIndex && p.alive);
    const row = document.createElement('div');
    row.className='status-row'+(!p.alive?' ko':'')+((isActing && !state.targetSelectMode)?' acting':'');
    const hpPct = p.hp/p.maxHp;
    const hpClass = hpPct<0.3?'low':(hpPct<0.6?'mid':'');
    row.innerHTML = `
      <div class="nm">${p.name}</div>
      <div class="bar-wrap">
        <span class="num">HP ${pad3(p.hp)}/${pad3(p.maxHp)}</span>
        <div class="bar-track"><div class="hp-fill ${hpClass}" style="width:${Math.max(0,hpPct*100)}%"></div></div>
      </div>
      <div class="bar-wrap">
        <span class="num">MP ${pad3(p.mp)}/${pad3(p.maxMp)}</span>
        <div class="bar-track"><div class="mp-fill" style="width:${p.maxMp?Math.max(0,p.mp/p.maxMp*100):0}%"></div></div>
      </div>`;
    el.statusWindow.appendChild(row);
  });
  updateTurnIndicator();
  if(state.targetSelectMode){
    el.statusWindow.scrollLeft = el.statusWindow.scrollWidth;
  } else {
    el.statusWindow.scrollLeft = 0;
  }
}

async function animateAttack(attackerId, targetId, isPartyAttacker){
  const a = document.getElementById('unit-'+attackerId);
  const t = document.getElementById('unit-'+targetId);
  if(a){
    a.classList.remove('idle');
    a.classList.add(isPartyAttacker?'attack-left':'attack-right');
  }
  await sleep(220);
  if(t){
    t.classList.add('hit','shake');
    screenFlash();
  }
  await sleep(260);
  if(a){ a.classList.remove('attack-left','attack-right'); a.classList.add('idle'); }
  if(t){ t.classList.remove('hit','shake'); }
}

    const angle = (Math.PI*2*i/particleCount) + (Math.random()*0.6-0.3);
    const dist = 20 + intensity*24 + Math.random()*14;
    const dx = (Math.cos(angle)*dist).toFixed(1)+'px';
    const dy = (Math.sin(angle)*dist*0.7).toFixed(1)+'px';
    const p = document.createElement('div');
    p.className='impact-particle';
    p.style.color = color;
    p.style.setProperty('--dx', dx);
    p.style.setProperty('--dy', dy);
    u.appendChild(p);
    setTimeout(()=>p.remove(), 600);
  }
}

function spawnSlashEffect(unitId, color, power, pattern){
  const u = document.getElementById('unit-'+unitId);
  if(!u) return;
  const intensity = Math.min(3, Math.max(0.6, (power||16)/16));
  const angles = pattern==='cross' ? [45, -45] : [45];
  const heightPct = Math.round(58 + intensity*16);
  const thickness = Math.round(4 + intensity*2);
  angles.forEach((angle, i)=>{
    const s = document.createElement('div');
    s.className='slash-mark';
    s.style.color = color || '#f0f0f0';
    s.style.height = heightPct+'%';
    s.style.width = thickness+'px';
    s.style.setProperty('--slash-angle', angle+'deg');
    s.style.animationDelay = (i*110)+'ms';
    u.appendChild(s);
    setTimeout(()=>s.remove(), 750+i*110);
  });
}

async function animateCast(casterId, color){
  const c = document.getElementById('unit-'+casterId);
  if(c){
    if(color) c.style.setProperty('--cast-color', color);
    c.classList.remove('idle'); c.classList.add('casting');
  }
  await sleep(500);
  screenFlash();
  await sleep(250);
  if(c){ c.classList.remove('casting'); c.classList.add('idle'); }
}
async function animateDeath(unitId){
  const u = document.getElementById('unit-'+unitId);
  if(u){ u.classList.add('fading'); }
  await sleep(500);
}

/* ================= command UI ================= */
const COMMANDS = [
  {key:'fight', label:'こうげき'},
  {key:'skill', label:'とくぎ'},
  {key:'magic', label:'まほう'},
  {key:'defend', label:'ぼうぎょ'},
  {key:'back', label:'もどる'}
];

function currentActor(){
  return state.party[state.turnIndex];
}

function renderCommands(){
  el.targetWindow.classList.add('hidden');
  el.cmdList.innerHTML='';
  state.activeTargetConfirm = null;
  if(state.targetSelectMode){
    state.targetSelectMode = false;
    renderStatus();
  }
  const actor = currentActor();
  if(!actor || !actor.alive){ return; }
  COMMANDS.forEach(cmd=>{
    if(cmd.key==='magic' && actor.spells.length===0) return;
    if(cmd.key==='skill' && actor.techniques.length===0) return;
    const disabled = (cmd.key==='back' && state.turnIndex<=0);
    const div = document.createElement('div');
    div.className = 'cmd-item'+(disabled?' disabled':'');
    div.innerHTML = `<span class="cursor">▶</span>&nbsp;<span>${cmd.label}</span>`;
    if(!disabled){
      div.addEventListener('click', ()=>{ (cmd.key==='back' ? sfxCancel() : sfxConfirm()); chooseCommand(cmd.key); });
      div.addEventListener('mouseenter', ()=>{
        sfxCursor();
        [...el.cmdList.children].forEach(c=>c.classList.remove('active'));
        div.classList.add('active');
      });
    }
    el.cmdList.appendChild(div);
  });
  if(el.cmdList.children.length){ el.cmdList.children[0].classList.add('active'); }
}

function clearTargetHighlights(){
  document.querySelectorAll('.unit').forEach(u=>{
    u.classList.remove('targetable','selected-target');
  });
}

function chooseCommand(key){
  const actor = currentActor();
  if(key==='defend'){
    queueAction({actorId:actor.id, isEnemy:false, type:'defend'});
    advanceTurn();
    return;
  }
  if(key==='fight'){
    showTargetSelect('enemy', (targetId)=>{
      queueAction({actorId:actor.id, isEnemy:false, type:'attack', targetId});
      advanceTurn();
    }, 'たいしょうをえらぶ');
    return;
  }
  if(key==='magic'){
    showSpellSelect(actor);
    return;
  }
  if(key==='skill'){
    showSkillSelect(actor);
    return;
  }
  if(key==='back'){
    goBackOneTurn();
    return;
  }
}

function showTargetSelect(side, onPick, promptText){
  clearTargetHighlights();
  el.targetWindow.classList.remove('hidden');
  document.getElementById('target-window').querySelector('.cmd-title').textContent = promptText;
  el.targetList.innerHTML='';
  state.targetSelectMode = true;
  renderStatus();
  const list = side==='enemy' ? state.enemies : state.party;
  const aliveList = list.filter(u=>u.alive);

  function confirmPick(id){
    sfxConfirm();
    highlightTarget(id, aliveList);
    clearTargetHighlights();
    el.targetWindow.classList.add('hidden');
    state.targetSelectMode = false;
    state.activeTargetConfirm = null;
    onPick(id);
  }
  state.activeTargetConfirm = confirmPick;

  aliveList.forEach(u=>{
    const uEl = document.getElementById('unit-'+u.id);
    if(uEl) uEl.classList.add('targetable');
    const div = document.createElement('div');
    div.className='cmd-item';
    div.dataset.targetId = u.id;
    const hpInfo = u.isEnemy ? '' : `　HP ${u.hp}/${u.maxHp}`;
    div.innerHTML = `<span class="cursor">▶</span><span>${u.name}${hpInfo}</span>`;
    div.addEventListener('mouseenter', ()=>{
      sfxCursor();
      highlightTarget(u.id, aliveList);
    });
    div.addEventListener('click', ()=> confirmPick(u.id));
    el.targetList.appendChild(div);
  });
  if(el.targetList.children.length){ el.targetList.children[0].classList.add('active'); }
}

function highlightTarget(id, aliveList){
  [...el.targetList.children].forEach(c=>c.classList.toggle('active', c.dataset.targetId===id));
  clearTargetHighlights();
  aliveList.forEach(l=>{ const x=document.getElementById('unit-'+l.id); if(x) x.classList.add('targetable'); });
  const uEl = document.getElementById('unit-'+id);
  if(uEl) uEl.classList.add('selected-target');
}

function setupBattlefieldTargetDelegation(){
  const bf = document.getElementById('battlefield');
  bf.addEventListener('mouseover', (e)=>{
    if(!state.targetSelectMode) return;
    const unitEl = e.target.closest('.unit.targetable');
    if(!unitEl) return;
    if(unitEl.classList.contains('selected-target')) return;
    document.querySelectorAll('.unit.targetable').forEach(u=>u.classList.remove('selected-target'));
    unitEl.classList.add('selected-target');
    sfxCursor();
    document.querySelectorAll('#target-list .cmd-item').forEach(c=>{
      c.classList.toggle('active', c.dataset.targetId===unitEl.dataset.id);
    });
  });
  bf.addEventListener('click', (e)=>{
    if(!state.targetSelectMode || !state.activeTargetConfirm) return;
    const unitEl = e.target.closest('.unit.targetable');
    if(!unitEl) return;
    state.activeTargetConfirm(unitEl.dataset.id);
  });
}

function queueAction(action){
  state.queuedActions.push(action);
}

function advanceTurn(){
  clearTargetHighlights();
  state.turnIndex++;
  while(state.turnIndex < state.party.length && !state.party[state.turnIndex].alive){
    state.turnIndex++;
  }
  renderStatus();
  if(state.turnIndex >= state.party.length){
    startResolvePhase();
  } else {
    hideMessageWindow();
    renderCommands();
  }
}

function goBackOneTurn(){
  if(state.turnIndex<=0) return;
  state.turnIndex--;
  while(state.turnIndex>0 && !state.party[state.turnIndex].alive){
    state.turnIndex--;
  }
  state.queuedActions.pop();
  clearTargetHighlights();
  renderStatus();
  hideMessageWindow();
  renderCommands();
}

/* ================= resolve phase ================= */
function pickWeighted(list){
  const total = list.reduce((s,a)=>s+(a.weight||1),0);
  let r = Math.random()*total;
  for(const a of list){
    r -= (a.weight||1);
    if(r<=0) return a;
  }
  return list[list.length-1];
}

function pickPartyTarget(aliveParty){
  if(state.tauntTargetId){
    const t = aliveParty.find(p=>p.id===state.tauntTargetId);
    if(t) return t;
  }
  return aliveParty[Math.floor(Math.random()*aliveParty.length)];
}

async function startResolvePhase(){
  state.phase='resolving';
  el.cmdList.innerHTML = '<div class="cmd-item disabled"><span class="cursor"></span><span>コマンドじっこうちゅう...</span></div>';
  el.targetWindow.classList.add('hidden');
  renderStatus();

  // このラウンドで挑発が使われていれば、敵が対象を選ぶ前に反映させる
  const tauntAction = state.queuedActions.find(a=>a.type==='taunt' && !a.isEnemy);
  if(tauntAction){
    const taunter = state.party.find(p=>p.id===tauntAction.actorId);
    if(taunter && taunter.alive){
      state.tauntTargetId = taunter.id;
      taunter.taunting = true;
    }
  }

  // enemy actions
  state.enemies.filter(e=>e.alive).forEach(en=>{
    const aliveParty = state.party.filter(p=>p.alive);
    if(aliveParty.length===0) return;
    if(en.abilities && en.abilities.length){
      let pick = pickWeighted(en.abilities);
      if(pick.type==='heal-self' && en.hp/en.maxHp>0.85){
        pick = en.abilities.find(a=>a.type==='attack-basic') || pick;
      }
      if(pick.type==='attack-basic'){
        const target = pickPartyTarget(aliveParty);
        state.queuedActions.push({actorId:en.id, isEnemy:true, type:'attack', targetId:target.id});
      } else if(pick.type==='atk-single'){
        const target = pickPartyTarget(aliveParty);
        state.queuedActions.push({actorId:en.id, isEnemy:true, type:'spell', spell:pick, targetId:target.id});
      } else if(pick.type==='atk-all'){
        state.queuedActions.push({actorId:en.id, isEnemy:true, type:'spell', spell:pick});
      } else if(pick.type==='heal-self'){
        state.queuedActions.push({actorId:en.id, isEnemy:true, type:'spell', spell:pick, targetId:en.id});
      }
    } else {
      const target = pickPartyTarget(aliveParty);
      state.queuedActions.push({actorId:en.id, isEnemy:true, type:'attack', targetId:target.id});
    }
  });

  // sort by speed desc (挑発を使ったキャラは最速で行動)
  const allUnits = {};
  state.party.forEach(p=>allUnits[p.id]=p);
  state.enemies.forEach(e=>allUnits[e.id]=e);
  const actions = state.queuedActions.slice().sort((a,b)=>{
    if(a.type==='taunt' && b.type!=='taunt') return -1;
    if(b.type==='taunt' && a.type!=='taunt') return 1;
    const ua = allUnits[a.actorId], ub = allUnits[b.actorId];
    return (ub? ub.spd:0) - (ua? ua.spd:0);
  });
  state.queuedActions = [];

  for(const action of actions){
    if(state.battleOver) break;
    const actor = allUnits[action.actorId];
    if(!actor || !actor.alive) continue;
    await executeAction(action, allUnits);
    if(checkBattleEnd()) { state.battleOver = true; break; }
  }

  if(!state.battleOver){
    nextRound();
  }
}

function resolveTarget(action, actor, allUnits){
  let target = allUnits[action.targetId];
  if(target && target.alive) return target;
  if(actor.isEnemy){
    const aliveParty = state.party.filter(p=>p.alive);
    if(aliveParty.length===0) return null;
    return pickPartyTarget(aliveParty);
  }
  const pool = state.enemies.filter(e=>e.alive);
  if(pool.length===0) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

async function executeAction(action, allUnits){
  const actor = allUnits[action.actorId];
  const isDamagingTech = action.type==='tech' && action.tech &&
    (action.tech.type==='tech-atk-single' || action.tech.type==='tech-atk-all');
  if(actor && state.chargeStacks[actor.id] && action.type!=='attack' && action.type!=='charge' && !isDamagingTech){
    delete state.chargeStacks[actor.id]; // 攻撃・ダメージを与えるとくぎ以外を選ぶとためた力は不発
  }
  if(action.type==='charge'){
    state.chargeStacks[actor.id] = (state.chargeStacks[actor.id]||0) + 1;
    const stackCount = state.chargeStacks[actor.id];
    popDamage(actor.id, 'ATK UP', 'heal');
    updateHpBarsOnly();
    setMessage(`${actor.name}は ちからを ためている!(${stackCount}回)`);
    await sleep(1500);
    return;
  }
  if(action.type==='taunt'){
    actor.mp = Math.max(0, actor.mp-2);
    actor.taunting = true;
    state.tauntTargetId = actor.id;
    setMessage(`${actor.name}の ちょうはつ! てきの こうげきを ひきつけている!`);
    await sleep(1500);
    return;
  }
  if(action.type==='defend'){
    setMessage(`${actor.name}は みをまもっている!`);
    actor.defending = true;
    await sleep(1500);
    return;
  }
  if(action.type==='attack'){
    const target = resolveTarget(action, actor, allUnits);
    if(!target){ return; }
    setMessage(`${actor.name}の こうげき!`);
    await animateAttack(actor.id, target.id, !actor.isEnemy);
    let dmg = Math.max(1, Math.round(actor.atk*(0.85+Math.random()*0.4) - target.def*(target.defending?1.6:1)));
    let wasCharged = false;
    let chargeStackUsed = 0;
    if(state.chargeStacks[actor.id]){
      chargeStackUsed = state.chargeStacks[actor.id];
      dmg = Math.round(dmg*(1 + 1.5*chargeStackUsed));
      delete state.chargeStacks[actor.id];
      wasCharged = true;
    }
    if(target.taunting){
      dmg = Math.max(1, Math.round(dmg/2));
    }
    const miss = Math.random() < 0.05;
    if(miss){
      popDamage(target.id, 'MISS', 'miss');
      setMessage(`${actor.name}の こうげきは はずれた!`);
      await sleep(1500);
      return;
    }
    target.hp = Math.max(0, target.hp - dmg);
    popDamage(target.id, dmg, null);
    playPhysicalSfx(actor);
    if(wasCharged){
      spawnImpactBurst(target.id, '#ffcc00', dmg);
    }
    if(actor.kind==='fighter' || actor.kind==='knight'){
      spawnSlashEffect(target.id, '#f0f0f0', dmg, 'single');
    }
    updateHpBarsOnly();
    setMessage(wasCharged ? `ためたちからを こめた こうげき!(×${chargeStackUsed}) ${target.name}に ${dmg}の ダメージ!` : `${target.name}に ${dmg}の ダメージ!`);
    await sleep(1500);
    if(target.hp<=0){
      target.alive = false;
      setMessage(`${target.name}を たおした!`);
      await animateDeath(target.id);
      await sleep(1500);
    } else {
      await applyPassiveOnHit(target, dmg, actor);
    }
    return;
  }
  if(action.type==='spell'){
    const sp = action.spell;
    if(actor.mp < sp.mp){
      setMessage(`${actor.name}は MPが たりない!`);
      await sleep(1500);
      return;
    }
    actor.mp -= sp.mp;
    setMessage(`${actor.name}は ${sp.name}を となえた!`);
    await animateCast(actor.id, EFFECT_COLORS[sp.name]);
    if(sp.type==='atk-single'){
      const target = resolveTarget(action, actor, allUnits);
      if(!target) return;
      let dmg = Math.max(1, Math.round(sp.power*(0.85+Math.random()*0.3)));
      if(target.taunting){ dmg = Math.max(1, Math.round(dmg/2)); }
      target.hp = Math.max(0, target.hp - dmg);
      spawnImpactBurst(target.id, EFFECT_COLORS[sp.name], dmg);
      playMagicSfx();
      popDamage(target.id, dmg, null);
      updateHpBarsOnly();
      setMessage(`${target.name}に ${dmg}の ダメージ!`);
      await sleep(1500);
      if(target.hp<=0){
        target.alive=false;
        setMessage(`${target.name}を たおした!`);
        await animateDeath(target.id);
        await sleep(1500);
      } else {
        await applyPassiveOnHit(target, dmg, actor);
      }
    } else if(sp.type==='heal-single'){
      const target = allUnits[action.targetId];
      if(!target) return;
      const heal = Math.round(sp.power*(0.9+Math.random()*0.2));
      target.hp = Math.min(target.maxHp, target.hp+heal);
      spawnImpactBurst(target.id, EFFECT_COLORS[sp.name], heal);
      playHealMagicSfx();
      popDamage(target.id, '+'+heal, 'heal');
      renderStatus();
      setMessage(`${target.name}の HPが ${heal} かいふくした!`);
      await sleep(1500);
    } else if(sp.type==='heal-all'){
      const targets = state.party.filter(p=>p.alive);
      playHealMagicSfx();
      for(const target of targets){
        const heal = Math.round(sp.power*(0.9+Math.random()*0.2));
        target.hp = Math.min(target.maxHp, target.hp+heal);
        spawnImpactBurst(target.id, EFFECT_COLORS[sp.name], heal);
        popDamage(target.id, '+'+heal, 'heal');
        await sleep(150);
      }
      renderStatus();
      setMessage(`${actor.name}の ${sp.name}で なかまぜんいんが かいふく!`);
      await sleep(1500);
    } else if(sp.type==='atk-all'){
      const targets = actor.isEnemy ? state.party.filter(p=>p.alive) : state.enemies.filter(e=>e.alive);
      await lungeForwardHold(actor.id, !actor.isEnemy);
      screenFlash();
      const hits = [];
      for(const target of targets){
        let dmg = Math.max(1, Math.round(sp.power*(0.85+Math.random()*0.3)));
        if(target.taunting){ dmg = Math.max(1, Math.round(dmg/2)); }
        target.hp = Math.max(0, target.hp - dmg);
        spawnImpactBurst(target.id, EFFECT_COLORS[sp.name], dmg);
        playMagicSfx();
        hitFlashTarget(target.id);
        popDamage(target.id, dmg, null);
        updateHpBarsOnly();
        hits.push({target, dmg});
      }
      await sleep(300);
      await lungeBackFromHold(actor.id);
      for(const {target, dmg} of hits){
        if(target.hp<=0){
          target.alive=false;
          await animateDeath(target.id);
        } else {
          await applyPassiveOnHit(target, dmg, actor);
        }
      }
      setMessage(`${actor.name}の ${sp.name}が ぜんたいを こうげき!`);
      await sleep(1500);
    } else if(sp.type==='heal-self'){
      const heal = Math.round(sp.power*(0.9+Math.random()*0.2));
      actor.hp = Math.min(actor.maxHp, actor.hp+heal);
      spawnImpactBurst(actor.id, EFFECT_COLORS[sp.name], heal);
      playHealMagicSfx();
      popDamage(actor.id, '+'+heal, 'heal');
      updateHpBarsOnly();
      setMessage(`${actor.name}は じぶんを ${heal} かいふく!`);
      await sleep(1500);
    } else if(sp.type==='buff-def'){
      const target = allUnits[action.targetId];
      if(!target) return;
      spawnImpactBurst(target.id, EFFECT_COLORS[sp.name]);
      playHealMagicSfx();
      target.def += 4;
      popDamage(target.id, 'DEF UP', 'heal');
      setMessage(`${target.name}の ぼうぎょがあがった!`);
      await sleep(1500);
    } else if(sp.type==='buff-def-all'){
      const targets = state.party.filter(p=>p.alive);
      playHealMagicSfx();
      for(const target of targets){
        target.def += (sp.power||4);
        spawnImpactBurst(target.id, EFFECT_COLORS[sp.name]);
        popDamage(target.id, 'DEF UP', 'heal');
        await sleep(150);
      }
      setMessage(`${actor.name}の ${sp.name}で なかまぜんいんのぼうぎょがあがった!`);
      await sleep(1500);
    }
    updateHpBarsOnly();
    return;
  }
  if(action.type==='tech'){
    const tech = action.tech;
    if(actor.mp < tech.mp){
      setMessage(`${actor.name}は MPが たりない!`);
      await sleep(1500);
      return;
    }
    actor.mp -= tech.mp;
    setMessage(`${actor.name}の ${tech.name}!`);
    if(tech.type==='tech-atk-single'){
      const target = resolveTarget(action, actor, allUnits);
      if(!target) return;
      await animateAttack(actor.id, target.id, !actor.isEnemy);
      const missChance = tech.hitRate!=null ? (1-tech.hitRate) : 0;
      if(Math.random() < missChance){
        popDamage(target.id, 'MISS', 'miss');
        setMessage(`${actor.name}の ${tech.name}は はずれた!`);
        await sleep(1500);
        return;
      }
      let dmg = Math.max(1, Math.round(actor.atk*tech.mult*(0.85+Math.random()*0.3) - target.def*(target.defending?1.6:1)));
      let wasCharged = false;
      let chargeStackUsed = 0;
      if(state.chargeStacks[actor.id]){
        chargeStackUsed = state.chargeStacks[actor.id];
        dmg = Math.round(dmg*(1 + 1.5*chargeStackUsed));
        delete state.chargeStacks[actor.id];
        wasCharged = true;
      }
      if(target.taunting){ dmg = Math.max(1, Math.round(dmg/2)); }
      target.hp = Math.max(0, target.hp - dmg);
      spawnImpactBurst(target.id, EFFECT_COLORS[tech.name], dmg);
      if(wasCharged){
        spawnImpactBurst(target.id, '#ffcc00', dmg);
      }
      playPhysicalSfx(actor);
      if(actor.kind==='fighter' || actor.kind==='knight'){
        spawnSlashEffect(target.id, EFFECT_COLORS[tech.name], dmg, 'cross');
      }
      popDamage(target.id, dmg, null);
      updateHpBarsOnly();
      setMessage(wasCharged ? `ためたちからを こめた ${tech.name}!(×${chargeStackUsed}) ${target.name}に ${dmg}の ダメージ!` : `${target.name}に ${dmg}の ダメージ!`);
      await sleep(1500);
      if(target.hp<=0){
        target.alive=false;
        setMessage(`${target.name}を たおした!`);
        await animateDeath(target.id);
        await sleep(1500);
      }
    } else if(tech.type==='tech-atk-all'){
      const targets = state.enemies.filter(e=>e.alive);
      await lungeForwardHold(actor.id, !actor.isEnemy);
      screenFlash();
      const chargeStackUsed = state.chargeStacks[actor.id] || 0;
      const wasCharged = chargeStackUsed > 0;
      if(wasCharged){ delete state.chargeStacks[actor.id]; }
      const hits = [];
      for(const target of targets){
        let dmg = Math.max(1, Math.round(actor.atk*tech.mult*(0.85+Math.random()*0.3) - target.def*(target.defending?1.6:1)));
        if(wasCharged){ dmg = Math.round(dmg*(1 + 1.5*chargeStackUsed)); }
        if(target.taunting){ dmg = Math.max(1, Math.round(dmg/2)); }
        target.hp = Math.max(0, target.hp - dmg);
        spawnImpactBurst(target.id, EFFECT_COLORS[tech.name], dmg);
        if(wasCharged){ spawnImpactBurst(target.id, '#ffcc00', dmg); }
        playPhysicalSfx(actor);
        hitFlashTarget(target.id);
        popDamage(target.id, dmg, null);
        updateHpBarsOnly();
        hits.push({target, dmg});
      }
      await sleep(300);
      await lungeBackFromHold(actor.id);
      for(const {target} of hits){
        if(target.hp<=0){
          target.alive=false;
          await animateDeath(target.id);
        }
      }
      setMessage(wasCharged ? `ためたちからを こめた ${actor.name}の ${tech.name}が てき ぜんたいを こうげき!(×${chargeStackUsed})` : `${actor.name}の ${tech.name}が てき ぜんたいを こうげき!`);
      await sleep(1500);
    }
    updateHpBarsOnly();
    return;
  }
}

async function applyPassiveOnHit(target, dmg, attacker){
  if(target.isEnemy || target.hp<=0) return;
  if(target.kind==='knight'){
    await sleep(500);
    const heal = Math.max(1, Math.round(dmg/4));
    target.hp = Math.min(target.maxHp, target.hp+heal);
    popDamage(target.id, '+'+heal, 'heal');
    updateHpBarsOnly();
    setMessage(`${target.name}は ${heal} 自然かいふくした!`);
    await sleep(1500);
  } else if(target.kind==='supermonk' || target.kind==='monk'){
    if(attacker && attacker.alive && attacker.isEnemy){
      const ratio = target.kind==='supermonk' ? 2 : 4;
      const counter = Math.max(1, Math.round(dmg/ratio));
      attacker.hp = Math.max(0, attacker.hp-counter);
      setMessage(`${target.name}の カウンター!`);
      await animateAttack(target.id, attacker.id, !target.isEnemy);
      popDamage(attacker.id, counter, null);
      updateHpBarsOnly();
      setMessage(`${attacker.name}に ${counter}の ダメージ!`);
      await sleep(1500);
      if(attacker.hp<=0){
        attacker.alive=false;
        setMessage(`${attacker.name}を たおした!`);
        await animateDeath(attacker.id);
        await sleep(1500);
      }
      updateHpBarsOnly();
    }
  }
}

function regenMp(p){
  if(!p || p.maxMp<=0 || p.mp>=p.maxMp) return;
  const amt = Math.round(p.maxMp*0.20);
  if(amt<=0) return;
  const before = p.mp;
  p.mp = Math.min(p.maxMp, p.mp+amt);
  const healed = p.mp-before;
  if(healed>0){
    popDamage(p.id, '+'+healed, 'mpheal');
  }
}

function applyTurnStartPassives(p){
  if(!p) return;
  regenMp(p);
  if(p.kind==='whitemage' && p.alive && p.hp<p.maxHp){
    setTimeout(()=>{
      if(!p.alive) return;
      const heal = 3;
      p.hp = Math.min(p.maxHp, p.hp+heal);
      popDamage(p.id, '+'+heal, 'heal');
      updateHpBarsOnly();
    }, 500);
  }
}

function checkBattleEnd(){
  const partyAlive = state.party.some(p=>p.alive);
  const enemiesAlive = state.enemies.some(e=>e.alive);
  if(!partyAlive){ endBattle(false); return true; }
  if(!enemiesAlive){ endBattle(true); return true; }
  return false;
}

function nextRound(){
  state.round++;
  state.turnIndex = 0;
  while(state.turnIndex < state.party.length && !state.party[state.turnIndex].alive){
    state.turnIndex++;
  }
  state.party.forEach(p=>{ p.defending=false; p.taunting=false; });
  state.tauntTargetId = null;
  state.phase='command';
  if(state.turnIndex >= state.party.length){
    // shouldn't happen (means all dead, handled above)
    return;
  }
  renderStatus();
  hideMessageWindow();
  state.party.forEach(p=>{ if(p.alive) applyTurnStartPassives(p); });
  renderStatus();
  renderCommands();
}

function endBattle(victory){
  state.battleOver = true;
  state.phase='over';
  el.cmdList.innerHTML='';
  if(!victory){
    stopBGM();
  } else {
    playVictoryFanfare();
  }
  setTimeout(()=>{
    el.endOverlay.classList.remove('hidden');
    if(!victory){
      el.endTitle.textContent = 'ぜんめつしました';
      el.endDesc.textContent = '';
      el.endBtn.textContent = 'はじめから';
      state.endAction = 'restart';
    } else if(state.stage===3){
      classChangeParty();
      el.endTitle.textContent = 'へいわが おとずれた';
      el.endDesc.textContent = 'ついに やみのしはいしゃを たおした!\n\nへいわが おとずれた!';
      el.endBtn.textContent = 'はじめから';
      state.endAction = 'restart';
    } else {
      const changed = classChangeParty();
      el.endTitle.textContent = 'しょうり!';
      let desc = 'てきを ぜんめつさせた!';
      if(changed.length){
        desc += '\n\nクラスチェンジした!';
      }
      el.endDesc.textContent = desc;
      el.endBtn.textContent = 'つぎのたたかいへ';
      state.endAction = 'continue';
    }
  }, 500);
}

el.endBtn.addEventListener('click', ()=>{
  sfxConfirm();
  el.endOverlay.classList.add('hidden');
  if(state.endAction==='restart'){
    state.stage = 1;
    showPartySelect();
  } else {
    startBattle(state.stage+1);
  }
});

/* ================= boot ================= */
function startBattle(stage){
  state.stage = stage || 1;
  state.round = 1;
  state.enemies = (state.stage===3) ? makeBossEncounter() : randomEncounter(state.stage);
  state.turnIndex = 0;
  state.queuedActions = [];
  if(state.stage===3){
    requestBGM(startBossBGM);
  } else {
    requestBGM(startBattleBGM);
  }
  state.battleOver = false;
  const gameEl = document.getElementById('game');
  gameEl.classList.toggle('terrain-castle', state.stage===3);
  gameEl.classList.toggle('terrain-desert', state.stage>=2 && state.stage!==3);
  state.phase='intro';
  state.party.forEach(p=>{ p.defending=false; p.taunting=false; });
  state.tauntTargetId = null;
  state.chargeStacks = {};
  while(state.turnIndex < state.party.length && !state.party[state.turnIndex].alive){
    state.turnIndex++;
  }
  renderUnits();
  renderStatus();
  const names = state.enemies.map(e=>e.name).join('、');
  setMessage(`${names}が あらわれた!`);
  setTimeout(()=>{
    if(state.turnIndex < state.party.length){
      state.phase='command';
      hideMessageWindow();
      state.party.forEach(p=>{ if(p.alive) applyTurnStartPassives(p); });
      renderStatus();
      renderCommands();
    }
  }, 3000);
}

/* ================= party selection ================= */
function renderPartySlots(){
  el.partySlots.innerHTML = '';
  state.partySelection.forEach((job, idx)=>{
    const row = document.createElement('div');
    row.className = 'party-slot';

    const label = document.createElement('div');
    label.className = 'slot-label';
    label.textContent = `キャラ${idx+1}`;
    row.appendChild(label);

    const prevBtn = document.createElement('button');
    prevBtn.textContent = '◀';
    prevBtn.addEventListener('click', ()=>{
      sfxCursor();
      const i = JOB_ORDER.indexOf(state.partySelection[idx]);
      state.partySelection[idx] = JOB_ORDER[(i-1+JOB_ORDER.length)%JOB_ORDER.length];
      renderPartySlots();
    });

    const preview = document.createElement('div');
    preview.className = 'slot-preview';
    const spriteDiv = document.createElement('div');
    spriteDiv.className = 'slot-sprite';
    const pos = PARTY_SHEET_MAP[job];
    if(pos){
      const posX = PARTY_SHEET_COLS>1 ? (pos.col/(PARTY_SHEET_COLS-1))*100 : 0;
      const posY = PARTY_SHEET_ROWS>1 ? (pos.row/(PARTY_SHEET_ROWS-1))*100 : 0;
      spriteDiv.style.backgroundPosition = posX+'% '+posY+'%';
    }
    const nameSpan = document.createElement('div');
    nameSpan.className = 'slot-name';
    nameSpan.textContent = JOB_DEFS[job].name;
    preview.appendChild(spriteDiv);
    preview.appendChild(nameSpan);

    const nextBtn = document.createElement('button');
    nextBtn.textContent = '▶';
    nextBtn.addEventListener('click', ()=>{
      sfxCursor();
      const i = JOB_ORDER.indexOf(state.partySelection[idx]);
      state.partySelection[idx] = JOB_ORDER[(i+1)%JOB_ORDER.length];
      renderPartySlots();
    });

    row.appendChild(prevBtn);
    row.appendChild(preview);
    row.appendChild(nextBtn);
    el.partySlots.appendChild(row);
  });
}

function showPartySelect(){
  if(!state.partySelection || state.partySelection.length!==4){
    state.partySelection = DEFAULT_PARTY_SELECTION.slice();
  }
  renderPartySlots();
  el.partySelectOverlay.classList.remove('hidden');
}

el.partyConfirmBtn.addEventListener('click', ()=>{
  sfxConfirm();
  state.party = buildPartyFromSelection(state.partySelection);
  el.partySelectOverlay.classList.add('hidden');
  startBattle(1);
});

spawnStars();
setupBattlefieldTargetDelegation();
document.getElementById('reload-btn').addEventListener('click', ()=>{
  location.reload();
});
document.getElementById('mute-btn').addEventListener('click', ()=>{
  audioMuted = !audioMuted;
  document.getElementById('mute-btn').classList.toggle('muted', audioMuted);
});

// ブラウザの自動再生制限対策: 画面のどこを触っても最初の1回で音声をアンロックする
function unlockAudioOnce(){
  getAudioCtx();
  document.removeEventListener('pointerdown', unlockAudioOnce);
  document.removeEventListener('keydown', unlockAudioOnce);
}
document.addEventListener('pointerdown', unlockAudioOnce, {once:true});
document.addEventListener('keydown', unlockAudioOnce, {once:true});

showPartySelect();

})();
</script>
</body>
