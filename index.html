<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>FF風サイドビューバトルデモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#090a1a;
    --window-blue:#0018a8;
    --window-blue-dark:#000860;
    --paper:#f0f0e4;
    --gold:#f8d870;
    --hp-green:#58d858;
    --hp-yellow:#f8d870;
    --hp-red:#e85858;
    --mp-blue:#68a8f8;
    --sky-1:#6ec6f5;
    --sky-2:#bfe6ff;
    --sky-3:#eaf7ff;
    --ground-1:#3f7a2c;
    --ground-2:#336422;
    --ground-3:#274d1a;
    --ground-tex-a:#2f5e21;
    --ground-tex-b:#376a27;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:#000;
    font-family:'Noto Sans JP', sans-serif;
    image-rendering:pixelated;
    overflow:hidden;
  }
  #game{
    width:100%;
    aspect-ratio:4/3.4;
    max-width:960px;
    max-height:100vh;
    max-height:100dvh;
    margin:0 auto;
    background:
      linear-gradient(to bottom,
        var(--sky-1) 0%,
        var(--sky-2) 10%,
        var(--sky-3) 11%,
        var(--ground-1) 11%,
        var(--ground-2) 50%,
        var(--ground-3) 100%);
    position:relative;
    display:flex;
    flex-direction:column;
    border:4px solid #000;
    box-shadow:0 0 0 3px #3a3a5a, 0 0 40px rgba(0,0,0,.8);
    font-size:17px;
    user-select:none;
    overflow:hidden;
  }
  #game.terrain-desert{
    --ground-1:#e0c07f;
    --ground-2:#c9a058;
    --ground-3:#a67c3d;
    --ground-tex-a:#d4af6a;
    --ground-tex-b:#e0bd7a;
  }
  #game.terrain-castle{
    --sky-1:#332c42;
    --sky-2:#241f30;
    --sky-3:#171320;
    --ground-1:#6b6b74;
    --ground-2:#54545c;
    --ground-3:#3a3a40;
    --ground-tex-a:#4a4a52;
    --ground-tex-b:#59595f;
  }
  #game::before{ /* ground texture, continues behind all UI */
    content:"";
    position:absolute;
    left:0;right:0;
    top:11%;bottom:0;
    background:repeating-linear-gradient(90deg,var(--ground-tex-a),var(--ground-tex-a) 18px,var(--ground-tex-b) 18px,var(--ground-tex-b) 36px);
    opacity:.45;
    box-shadow:inset 0 4px 0 rgba(255,255,255,.1);
    pointer-events:none;
    z-index:0;
  }
  @media (max-width:700px){
    #game{font-size:13px; aspect-ratio:3/5; max-height:100dvh;}
  }
  @media (max-width:480px){
    #game{aspect-ratio:9/17;}
  }

  /* ---------- battlefield ---------- */
  #battlefield{
    flex:1;
    position:relative;
    background:transparent;
    overflow:hidden;
    z-index:1;
  }
  #stars{display:none;}
  .star{position:absolute;width:2px;height:2px;background:#fff;opacity:.6;animation:twinkle 2.4s infinite ease-in-out;}
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.8;}}

  #enemy-row{
    position:absolute;
    left:5%;
    top:18%;
    bottom:2%;
    width:26%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-evenly;
    gap:1%;
  }
  #party-row{
    position:absolute;
    right:5%;
    top:18%;
    bottom:2%;
    width:22%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-evenly;
    gap:1%;
  }

  .unit{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:transform .18s ease;
    cursor:default;
  }
  .unit .shadow{
    width:70%;
    height:9px;
    background:rgba(0,0,0,.5);
    border-radius:50%;
    margin-top:2px;
    filter:blur(1px);
  }
  .unit.targetable{cursor:pointer;}
  .unit.targetable:hover .sprite, .unit.selected-target .sprite{
    filter:drop-shadow(0 0 6px var(--gold)) brightness(1.25);
  }
  .unit.dead{opacity:.25;filter:grayscale(1);}
  .unit .hpbar-mini{
    width:56px;
    max-width:70%;
    height:6px;
    background:#111;
    border:1px solid #000;
    margin-top:4px;
    box-shadow:0 0 0 1px #4a4a6a;
  }
  .unit .hpbar-mini > div{height:100%;background:var(--hp-green);transition:width .35s ease;}
  .unit .enemy-name-tag{
    font-size:.95em;
    color:#fff;
    margin-top:2px;
    text-shadow:1px 1px 0 #000;
  }

  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  @keyframes lungeRight{0%{transform:translateX(0);}45%{transform:translateX(60px) scale(1.05);}55%{transform:translateX(60px) scale(1.05);}100%{transform:translateX(0);}}
  @keyframes lungeLeft{0%{transform:translateX(0);}45%{transform:translateX(-60px) scale(1.05);}55%{transform:translateX(-60px) scale(1.05);}100%{transform:translateX(0);}}
  @keyframes flashHit{0%,100%{filter:none;}30%{filter:brightness(3) saturate(0) drop-shadow(0 0 8px #fff);}60%{filter:brightness(0.2) sepia(1) saturate(6) hue-rotate(-40deg);}}
  @keyframes shakeSmall{0%,100%{transform:translateX(0);}20%{transform:translateX(-4px);}40%{transform:translateX(4px);}60%{transform:translateX(-3px);}80%{transform:translateX(3px);}}
  @keyframes castGlow{0%,100%{filter:none;}50%{filter:brightness(1.8) drop-shadow(0 0 10px var(--cast-color, #b0e0ff));}}
  .impact-burst{
    position:absolute;
    left:50%; top:42%;
    width:10px;height:10px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:18;
    animation:burstPop .5s ease forwards;
  }
  @keyframes burstPop{
    0%{ opacity:.95; width:8px; height:8px; box-shadow:0 0 0 0 currentColor;}
    100%{ opacity:0; width:64px; height:64px; box-shadow:0 0 26px 8px currentColor;}
  }
  .turn-arrow{
    position:absolute;
    top:-1.05em;
    left:50%;
    transform:translateX(-50%);
    font-size:1.4em;
    color:#fff;
    text-shadow:1px 1px 0 #000, -1px -1px 0 #000;
    opacity:0;
    pointer-events:none;
    z-index:5;
  }
  .turn-arrow.show{
    animation:arrowBlink 1.4s ease-in-out infinite;
  }
  @keyframes arrowBlink{0%,100%{opacity:1;}50%{opacity:.1;}}
  .target-hover-arrow{
    position:absolute;
    top:-1.05em;
    left:50%;
    transform:translateX(-50%);
    font-size:1.4em;
    color:#fff;
    text-shadow:1px 1px 0 #000, -1px -1px 0 #000;
    opacity:0;
    pointer-events:none;
    z-index:6;
    transition:opacity .1s ease;
  }
  .unit.selected-target .target-hover-arrow{opacity:1;}
  .unit.targetable:hover .target-hover-arrow{opacity:1;}
  @keyframes fadeOutUnit{to{opacity:0;transform:translateY(10px) scale(.85) rotate(8deg);}}

  .unit.idle .sprite{}
  .unit.attack-right .sprite{animation:lungeRight .5s ease;}
  .unit.attack-left .sprite{animation:lungeLeft .5s ease;}
  .unit.hit .sprite{animation:flashHit .45s ease;}
  .unit.shake{animation:shakeSmall .4s ease;}
  .unit.casting .sprite{animation:castGlow .6s ease 2;}
  .unit.fading{animation:fadeOutUnit .6s forwards;}

  .sprite{position:relative;}
  .sprite-sheet{
    width:5.175em;
    height:5.175em;
    background-image:var(--party-sheet-url);
    background-size:400% 400%;
    background-repeat:no-repeat;
    image-rendering:auto;
    filter:drop-shadow(1px 2px 1px rgba(0,0,0,.4));
  }

  /* pixel sprites built from stacked divs (box-shadow pixel grid) */
  .px{
    width:4px;height:4px;
    position:absolute;
    box-shadow: var(--pixels);
  }

  /* floating damage / heal numbers */
  .dmg-pop{
    position:absolute;
    left:50%;top:-6px;
    transform:translateX(-50%);
    font-family:'Press Start 2P',monospace;
    font-size:26px;
    color:#fff;
    text-shadow:2px 2px 0 #000, -1px -1px 0 #000;
    pointer-events:none;
    animation:popUp 1s ease forwards;
    z-index:20;
  }
  .dmg-pop.heal{color:#8cffb0;}
  .dmg-pop.mpheal{color:#68a8f8;}
  .dmg-pop.miss{color:#cfcfe8;}
  @keyframes popUp{
    0%{opacity:0;transform:translate(-50%,6px) scale(.7);}
    15%{opacity:1;transform:translate(-50%,-14px) scale(1.15);}
    75%{opacity:1;transform:translate(-50%,-30px) scale(1);}
    100%{opacity:0;transform:translate(-50%,-40px) scale(1);}
  }

  #flash-overlay{
    position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30;
  }
  .flash-on{animation:screenFlash .18s ease;}
  @keyframes screenFlash{0%{opacity:.75;}100%{opacity:0;}}

  /* ---------- bottom UI ---------- */
  #ui-bottom{
    height:27%;
    display:flex;
    flex-direction:column;
    background:transparent;
    padding:6px;
    gap:6px;
    position:relative;
    z-index:1;
  }
  .window{
    background:linear-gradient(#0b1470,#050a3c);
    border:3px solid var(--paper);
    box-shadow:inset 0 0 0 2px var(--window-blue-dark), 0 2px 0 rgba(0,0,0,.4);
    border-radius:2px;
    color:var(--paper);
    padding:8px 10px;
  }
  #message-window{
    position:absolute;
    left:6px;
    right:6px;
    bottom:3%;
    height:8.5%;
    font-size:1.05em;
    line-height:1.3;
    display:flex;
    align-items:center;
    letter-spacing:.02em;
    z-index:15;
  }
  #message-window span.blinker{
    display:inline-block;
    margin-left:8px;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  #lower-panels{
    flex:1;
    display:flex;
    gap:6px;
    min-height:0;
  }
  #command-window{
    flex:0 0 32%;
    display:flex;
    flex-direction:column;
    gap:2px;
    font-size:1.05em;
    overflow-y:auto;
  }
  #command-window .cmd-title{
    color:var(--gold);
    font-size:.85em;
    margin-bottom:4px;
    text-shadow:1px 1px 0 #000;
  }
  .cmd-item{
    display:flex;align-items:center;gap:6px;
    padding:3px 4px;cursor:pointer;
    border-radius:2px;
  }
  .cmd-item .cursor{
    width:10px;color:#fff;opacity:0;
  }
  .cmd-item.active .cursor{opacity:1;animation:blink .6s steps(1) infinite;}
  .cmd-item.disabled{opacity:.35;cursor:default;}

  #status-window{
    flex:1;
    display:grid;
    grid-template-columns:1fr;
    gap:1px;
    font-size:1.05em;
    overflow-y:auto;
  }
  .status-row{
    display:grid;
    grid-template-columns:132px 1fr 1fr;
    align-items:center;
    gap:4px;
    padding:1.5px 4px;
    border-radius:2px;
  }
  .status-row .nm{
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;gap:4px;
  }
  .status-row.ko .nm{color:#8888a8;text-decoration:line-through;}
  .bar-wrap{display:flex;align-items:center;justify-content:flex-end;gap:5px;}
  .bar-track{width:68px;flex:0 0 auto;height:9px;background:#000;border:1px solid #050a3c;box-shadow:0 0 0 1px #5060c0;}
  .bar-track > div{height:100%;}
  .hp-fill{background:linear-gradient(#7cf07c,var(--hp-green));}
  .hp-fill.mid{background:linear-gradient(#f8e888,var(--hp-yellow));}
  .hp-fill.low{background:linear-gradient(#f89898,var(--hp-red));}
  .mp-fill{background:linear-gradient(#a8d0ff,var(--mp-blue));}
  .num{font-family:'Press Start 2P',monospace;font-size:.9em;color:#dfe4ff;text-align:left;white-space:pre;}

  #target-window{
    flex:0 0 34%;
    display:flex;flex-direction:column;gap:2px;font-size:1.05em;overflow-y:auto;
  }

  .hidden{display:none !important;}

  #end-overlay{
    position:absolute;inset:0;
    background:rgba(0,0,0,.82);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;color:var(--paper);text-align:center;z-index:50;
  }
  #end-overlay h2{
    font-family:'Press Start 2P',monospace;
    font-size:1.4em;color:var(--gold);
    text-shadow:2px 2px 0 #000;
    letter-spacing:.05em;
  }
  #end-overlay button{
    font-family:'Noto Sans JP',sans-serif;
    font-size:1em;
    background:var(--window-blue);
    color:#fff;
    border:2px solid var(--paper);
    padding:10px 22px;
    cursor:pointer;
    border-radius:2px;
  }
  #end-overlay button:hover{background:#1a2ac8;}
  #end-overlay p{max-width:70%;line-height:1.6;color:#dfe4ff;font-size:.9em;white-space:pre-line;}
</style>
</head>
<body>
<div id="game">
  <div id="battlefield">
    <div id="stars"></div>
    <div id="enemy-row"></div>
    <div id="party-row"></div>
    <div id="message-window" class="window hidden">
      <div id="message-text">たたかいがはじまった!</div>
    </div>
    <div id="flash-overlay"></div>
    <div id="end-overlay" class="hidden">
      <h2 id="end-title"></h2>
      <p id="end-desc"></p>
      <button id="end-btn">つぎのたたかいへ</button>
    </div>
  </div>

  <div id="ui-bottom">
    <div id="lower-panels">
      <div id="command-window" class="window">
        <div id="cmd-list"></div>
      </div>
      <div id="target-window" class="window hidden">
        <div class="cmd-title">たいしょうをえらぶ</div>
        <div id="target-list"></div>
      </div>
      <div id="status-window" class="window"></div>
    </div>
  </div>
</div>

const PARTY_SHEET_COLS = 4;
const PARTY_SHEET_ROWS = 4;
const PARTY_SHEET_MAP = {
  fighter:{col:0,row:0},
  mage:{col:1,row:0},
  priest:{col:2,row:0},
  monk:{col:3,row:0},
  knight:{col:0,row:1},
  blackmage:{col:1,row:1},
  whitemage:{col:2,row:1},
  supermonk:{col:3,row:1}
};
document.documentElement.style.setProperty('--party-sheet-url', `url(${PARTY_SHEET})`);

function buildSpriteEl(kind, pxSize){
  if(PARTY_SHEET_MAP[kind]){
    const {col,row} = PARTY_SHEET_MAP[kind];
    const wrap = document.createElement('div');
    wrap.className = 'sprite sprite-sheet';
    const posX = PARTY_SHEET_COLS>1 ? (col/(PARTY_SHEET_COLS-1))*100 : 0;
    const posY = PARTY_SHEET_ROWS>1 ? (row/(PARTY_SHEET_ROWS-1))*100 : 0;
    wrap.style.backgroundPosition = posX + '% ' + posY + '%';
    return wrap;
  }
  const pattern = SPRITES[kind];
  const palette = PALETTES[kind];
  const rows = pattern.length;
  const cols = Math.max(...pattern.map(r=>r.length));
  const wrap = document.createElement('div');
  wrap.className = 'sprite';
  wrap.style.width = (cols*pxSize)+'px';
  wrap.style.height = (rows*pxSize)+'px';
  let shadows = [];
  for(let y=0;y<rows;y++){
    const row = pattern[y];
    for(let x=0;x<cols;x++){
      const ch = row[x];
      if(ch && ch!=='.' && palette[ch]){
        shadows.push(`${x*pxSize}px ${y*pxSize}px 0 0 ${palette[ch]}`);
      }
    }
  }
  const px = document.createElement('div');
  px.className='px';
  px.style.setProperty('--pixels', shadows.join(','));
  px.style.left='0';px.style.top='0';
  wrap.appendChild(px);
  return wrap;
}

function applyJobSkills(p){
  switch(p.kind){
    case 'knight':
      p.maxMp = Math.max(p.maxMp, 8); p.mp = p.maxMp;
      p.techniques = (p.techniques||[]).concat([
        {name:'じゅうじぎり',mp:4,mult:1.8,type:'tech-atk-single'}
      ]);
      break;
    case 'blackmage':
      p.maxMp += 6; p.mp = p.maxMp;
      p.spells = (p.spells||[]).concat([
        {name:'メテオ',mp:6,power:38,type:'atk-all'}
      ]);
      break;
    case 'whitemage':
      p.maxMp += 6; p.mp = p.maxMp;
      p.spells = (p.spells||[]).concat([
        {name:'ケアルガ',mp:12,power:22,type:'heal-all'}
      ]);
      break;
    case 'supermonk':
      p.maxMp = Math.max(p.maxMp, 8); p.mp = p.maxMp;
      p.techniques = (p.techniques||[]).concat([
        {name:'しんくうは',mp:4,mult:1.2,type:'tech-atk-all'}
      ]);
      break;
  }
}

function classChangeParty(){
  const changed = [];
  state.party.forEach(p=>{
    const eve = EVOLUTION[p.kind];
    if(!eve || p.evolved) return;
    const oldName = p.name;
    p.kind = eve.kind;
    p.name = eve.name;
    p.evolved = true;
    applyJobSkills(p);
    changed.push({from:oldName, to:eve.name});
  });
  if(changed.length){
    renderUnits();
    renderStatus();
  }
  return changed;
}

function randomEncounter(round){
  const n = Math.min(4, 2 + Math.floor(Math.random()*2) + (round>2?1:0));
  const list = [];
  const pool = round>=3 ? ENEMY_POOL : ENEMY_POOL.slice(0,3);
  for(let i=0;i<n;i++){
    const maker = pool[Math.floor(Math.random()*pool.length)];
    const e = maker();
    e.id = e.id+'_'+i;
    list.push(e);
  }
  return list;
}

  partyRow: document.getElementById('party-row'),
  msg: document.getElementById('message-text'),
  messageWindow: document.getElementById('message-window'),
  cmdList: document.getElementById('cmd-list'),
  targetWindow: document.getElementById('target-window'),
  targetList: document.getElementById('target-list'),
  statusWindow: document.getElementById('status-window'),
  flash: document.getElementById('flash-overlay'),
  endOverlay: document.getElementById('end-overlay'),
  endTitle: document.getElementById('end-title'),
  endDesc: document.getElementById('end-desc'),
  endBtn: document.getElementById('end-btn'),
};

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function setMessage(t){ el.msg.textContent = t; el.messageWindow.classList.remove('hidden'); }
function hideMessageWindow(){ el.messageWindow.classList.add('hidden'); }

/* ---------- stars background ---------- */
function spawnStars(){
  const container = document.getElementById('stars');
  container.innerHTML='';
  for(let i=0;i<28;i++){
    const s = document.createElement('div');
    s.className='star';
    s.style.left = Math.random()*100+'%';
    s.style.top = (Math.random()*55)+'%';
    s.style.animationDelay = (Math.random()*2.4)+'s';
    container.appendChild(s);
  }
}

/* ---------- rendering units ---------- */
function renderUnits(){
  el.enemyRow.innerHTML='';
  state.enemies.forEach(en=>{
    const u = document.createElement('div');
    u.className = 'unit idle' + (en.alive?'':' dead');
    u.id = 'unit-'+en.id;
    u.dataset.id = en.id;
    const hoverArrow = document.createElement('div');
    hoverArrow.className = 'target-hover-arrow';
    hoverArrow.textContent = '▼';
    u.appendChild(hoverArrow);
    const spriteScale = en.kind==='darklord' ? 9 : (en.kind==='ogre' ? 6 : (en.kind==='slime'?6:5));
    const sprite = buildSpriteEl(en.kind, spriteScale);
    u.appendChild(sprite);
    const shadow = document.createElement('div');
    shadow.className='shadow';
    u.appendChild(shadow);
    const tag = document.createElement('div');
    tag.className='enemy-name-tag';
    tag.textContent = en.name;
    u.appendChild(tag);
    const hpMini = document.createElement('div');
    hpMini.className='hpbar-mini';
    const hpFill = document.createElement('div');
    hpFill.style.width = Math.max(0,(en.hp/en.maxHp*100))+'%';
    hpFill.style.background = en.hp/en.maxHp<0.3?'#e85858':(en.hp/en.maxHp<0.6?'#f8d870':'#58d858');
    hpMini.appendChild(hpFill);
    u.appendChild(hpMini);
    el.enemyRow.appendChild(u);
  });

  el.partyRow.innerHTML='';
  state.party.forEach(p=>{
    const u = document.createElement('div');
    u.className = 'unit idle' + (p.alive?'':' dead');
    u.id = 'unit-'+p.id;
    u.dataset.id = p.id;
    const arrow = document.createElement('div');
    arrow.className = 'turn-arrow';
    arrow.id = 'arrow-'+p.id;
    arrow.textContent = '▼';
    u.appendChild(arrow);
    const hoverArrow = document.createElement('div');
    hoverArrow.className = 'target-hover-arrow';
    hoverArrow.textContent = '▼';
    u.appendChild(hoverArrow);
    const sprite = buildSpriteEl(p.kind, 5);
    u.appendChild(sprite);
    const shadow = document.createElement('div');
    shadow.className='shadow';
    u.appendChild(shadow);
    el.partyRow.appendChild(u);
  });
}

function updateTurnIndicator(){
  state.party.forEach((p,i)=>{
    const arrow = document.getElementById('arrow-'+p.id);
    if(!arrow) return;
    const active = (state.phase==='command' && i===state.turnIndex && p.alive);
    arrow.classList.toggle('show', active);
  });
}

function pad3(n){
  const s = String(n);
  return s.length>=3 ? s : s + '\u00A0'.repeat(3-s.length);
}

function renderStatus(){
  el.statusWindow.innerHTML='';
  const list = state.targetSelectMode
    ? state.party.map((p,i)=>({p,i})).filter(({i})=>i===state.turnIndex)
    : state.party.map((p,i)=>({p,i}));
  list.forEach(({p,i})=>{
    const isActing = (state.phase!=='resolving' && i===state.turnIndex && p.alive);
    const row = document.createElement('div');
    row.className='status-row'+(!p.alive?' ko':'')+((isActing && !state.targetSelectMode)?' acting':'');
    const hpPct = p.hp/p.maxHp;
    const hpClass = hpPct<0.3?'low':(hpPct<0.6?'mid':'');
    row.innerHTML = `
      <div class="nm">${p.name}</div>
      <div class="bar-wrap">
        <span class="num">HP ${pad3(p.hp)}/${pad3(p.maxHp)}</span>
        <div class="bar-track"><div class="hp-fill ${hpClass}" style="width:${Math.max(0,hpPct*100)}%"></div></div>
      </div>
      <div class="bar-wrap">
        <span class="num">MP ${pad3(p.mp)}/${pad3(p.maxMp)}</span>
        <div class="bar-track"><div class="mp-fill" style="width:${p.maxMp?Math.max(0,p.mp/p.maxMp*100):0}%"></div></div>
      </div>`;
    el.statusWindow.appendChild(row);
  });
  updateTurnIndicator();
}

/* ---------- effects ---------- */
function popDamage(targetId, text, kind){
  const u = document.getElementById('unit-'+targetId);
  if(!u) return;
  const d = document.createElement('div');
  d.className = 'dmg-pop'+(kind?(' '+kind):'');
  d.textContent = text;
  u.appendChild(d);
  setTimeout(()=>d.remove(), 1000);
}
function screenFlash(){
  el.flash.classList.remove('flash-on');
  void el.flash.offsetWidth;
  el.flash.classList.add('flash-on');
}
function updateHpBarsOnly(){
  state.enemies.forEach(en=>{
    const u = document.getElementById('unit-'+en.id);
    if(!u) return;
    const fill = u.querySelector('.hpbar-mini > div');
    if(fill){
      fill.style.width = Math.max(0,(en.hp/en.maxHp*100))+'%';
      fill.style.background = en.hp/en.maxHp<0.3?'#e85858':(en.hp/en.maxHp<0.6?'#f8d870':'#58d858');
    }
  });
  renderStatus();
}

async function animateAttack(attackerId, targetId, isPartyAttacker){
  const a = document.getElementById('unit-'+attackerId);
  const t = document.getElementById('unit-'+targetId);
  if(a){
    a.classList.remove('idle');
    a.classList.add(isPartyAttacker?'attack-left':'attack-right');
  }
  await sleep(220);
  if(t){
    t.classList.add('hit','shake');
    screenFlash();
  }
  await sleep(260);
  if(a){ a.classList.remove('attack-left','attack-right'); a.classList.add('idle'); }
  if(t){ t.classList.remove('hit','shake'); }
}
const EFFECT_COLORS = {
  'ファイア':'#ff4433',
  'ブリザド':'#3388ff',
  'ケアル':'#44ff88',
  'ケアルガ':'#44ff88',
  'プロテス':'#66e0ff',
  'メテオ':'#111111',
  'しんくうは':'#ffffff',
  'せいけんづき':'#ff9933',
  'りょうてぎり':'#ffe066',
  'じゅうじぎり':'#ffe066'
};

function spawnImpactBurst(unitId, color){
  if(!color) return;
  const u = document.getElementById('unit-'+unitId);
  if(!u) return;
  const b = document.createElement('div');
  b.className='impact-burst';
  b.style.color = color;
  b.style.background = color;
  u.appendChild(b);
  setTimeout(()=>b.remove(), 520);
}

async function animateCast(casterId, color){
  const c = document.getElementById('unit-'+casterId);
  if(c){
    if(color) c.style.setProperty('--cast-color', color);
    c.classList.remove('idle'); c.classList.add('casting');
  }
  await sleep(500);
  screenFlash();
  await sleep(250);
  if(c){ c.classList.remove('casting'); c.classList.add('idle'); }
}
async function animateDeath(unitId){
  const u = document.getElementById('unit-'+unitId);
  if(u){ u.classList.add('fading'); }
  await sleep(500);
}

/* ================= command UI ================= */
const COMMANDS = [
  {key:'fight', label:'たたかう'},
  {key:'skill', label:'とくぎ'},
  {key:'magic', label:'まほう'},
  {key:'defend', label:'ぼうぎょ'},
  {key:'back', label:'もどる'}
];

function currentActor(){
  return state.party[state.turnIndex];
}

function renderCommands(){
  el.targetWindow.classList.add('hidden');
  el.cmdList.innerHTML='';
  state.activeTargetConfirm = null;
  if(state.targetSelectMode){
    state.targetSelectMode = false;
    renderStatus();
  }
  const actor = currentActor();
  if(!actor || !actor.alive){ return; }
  COMMANDS.forEach(cmd=>{
    const disabled = (cmd.key==='magic' && actor.spells.length===0)
      || (cmd.key==='skill' && actor.techniques.length===0)
      || (cmd.key==='back' && state.turnIndex<=0);
    const div = document.createElement('div');
    div.className = 'cmd-item'+(disabled?' disabled':'');
    div.innerHTML = `<span class="cursor">▶</span>&nbsp;<span>${cmd.label}</span>`;
    if(!disabled){
      div.addEventListener('click', ()=>chooseCommand(cmd.key));
      div.addEventListener('mouseenter', ()=>{
        [...el.cmdList.children].forEach(c=>c.classList.remove('active'));
        div.classList.add('active');
      });
    }
    el.cmdList.appendChild(div);
  });
  if(el.cmdList.children.length){ el.cmdList.children[0].classList.add('active'); }
}

function clearTargetHighlights(){
  document.querySelectorAll('.unit').forEach(u=>{
    u.classList.remove('targetable','selected-target');
  });
}

function chooseCommand(key){
  const actor = currentActor();
  if(key==='defend'){
    queueAction({actorId:actor.id, isEnemy:false, type:'defend'});
    advanceTurn();
    return;
  }
  if(key==='fight'){
    showTargetSelect('enemy', (targetId)=>{
      queueAction({actorId:actor.id, isEnemy:false, type:'attack', targetId});
      advanceTurn();
    }, 'こうげきするてきをえらんでください');
    return;
  }
  if(key==='magic'){
    showSpellSelect(actor);
    return;
  }
  if(key==='skill'){
    showSkillSelect(actor);
    return;
  }
  if(key==='back'){
    goBackOneTurn();
    return;
  }
}

function showSpellSelect(actor){
  el.targetWindow.classList.remove('hidden');
  document.getElementById('target-window').querySelector('.cmd-title').textContent='まほうをえらぶ';
  el.targetList.innerHTML='';
  actor.spells.forEach(sp=>{
    const disabled = actor.mp < sp.mp;
    const div = document.createElement('div');
    div.className='cmd-item'+(disabled?' disabled':'');
    div.innerHTML = `<span class="cursor">▶</span>&nbsp;<span>${sp.name}　(MP${sp.mp})</span>`;
    if(!disabled){
      div.addEventListener('click', ()=>{
        if(sp.type==='atk-all' || sp.type==='heal-all'){
          el.targetWindow.classList.add('hidden');
          queueAction({actorId:actor.id, isEnemy:false, type:'spell', spell:sp});
          advanceTurn();
        } else if(sp.type==='heal-single' || sp.type==='buff-def'){
          showTargetSelect('party', (targetId)=>{
            queueAction({actorId:actor.id, isEnemy:false, type:'spell', spell:sp, targetId});
            advanceTurn();
          }, 'たいしょうをえらんでください');
        } else {
          showTargetSelect('enemy', (targetId)=>{
            queueAction({actorId:actor.id, isEnemy:false, type:'spell', spell:sp, targetId});
            advanceTurn();
          }, 'こうげきするてきをえらんでください');
        }
      });
      div.addEventListener('mouseenter', ()=>{
        [...el.targetList.children].forEach(c=>c.classList.remove('active'));
        div.classList.add('active');
      });
    }
    el.targetList.appendChild(div);
  });
  const back = document.createElement('div');
  back.className='cmd-item';
  back.innerHTML = `<span class="cursor">▶</span>&nbsp;<span>もどる</span>`;
  back.addEventListener('click', ()=>{ el.targetWindow.classList.add('hidden'); document.getElementById('target-window').querySelector('.cmd-title').textContent='たいしょうをえらぶ'; });
  el.targetList.appendChild(back);
}

function showSkillSelect(actor){
  el.targetWindow.classList.remove('hidden');
  document.getElementById('target-window').querySelector('.cmd-title').textContent='とくぎをえらぶ';
  el.targetList.innerHTML='';
  actor.techniques.forEach(tech=>{
    const disabled = actor.mp < tech.mp;
    const div = document.createElement('div');
    div.className='cmd-item'+(disabled?' disabled':'');
    const mpTag = tech.mp>0 ? `　(MP${tech.mp})` : '';
    div.innerHTML = `<span class="cursor">▶</span>&nbsp;<span>${tech.name}${mpTag}</span>`;
    if(!disabled){
      div.addEventListener('click', ()=>{
        if(tech.type==='tech-atk-all'){
          el.targetWindow.classList.add('hidden');
          queueAction({actorId:actor.id, isEnemy:false, type:'tech', tech, targetAll:true});
          advanceTurn();
        } else {
          showTargetSelect('enemy', (targetId)=>{
            queueAction({actorId:actor.id, isEnemy:false, type:'tech', tech, targetId});
            advanceTurn();
          }, 'こうげきするてきをえらんでください');
        }
      });
      div.addEventListener('mouseenter', ()=>{
        [...el.targetList.children].forEach(c=>c.classList.remove('active'));
        div.classList.add('active');
      });
    }
    el.targetList.appendChild(div);
  });
  const back = document.createElement('div');
  back.className='cmd-item';
  back.innerHTML = `<span class="cursor">▶</span>&nbsp;<span>もどる</span>`;
  back.addEventListener('click', ()=>{ el.targetWindow.classList.add('hidden'); document.getElementById('target-window').querySelector('.cmd-title').textContent='たいしょうをえらぶ'; });
  el.targetList.appendChild(back);
}

function showTargetSelect(side, onPick, promptText){
  clearTargetHighlights();
  el.targetWindow.classList.remove('hidden');
  document.getElementById('target-window').querySelector('.cmd-title').textContent = promptText;
  el.targetList.innerHTML='';
  state.targetSelectMode = true;
  renderStatus();
  const list = side==='enemy' ? state.enemies : state.party;
  const aliveList = list.filter(u=>u.alive);

  function confirmPick(id){
    clearTargetHighlights();
    el.targetWindow.classList.add('hidden');
    state.targetSelectMode = false;
    state.activeTargetConfirm = null;
    onPick(id);
  }
  state.activeTargetConfirm = confirmPick;

  aliveList.forEach(u=>{
    const uEl = document.getElementById('unit-'+u.id);
    if(uEl) uEl.classList.add('targetable');
    const div = document.createElement('div');
    div.className='cmd-item';
    div.dataset.targetId = u.id;
    const hpInfo = u.isEnemy ? '' : `　HP ${u.hp}/${u.maxHp}`;
    div.innerHTML = `<span class="cursor">▶</span>&nbsp;<span>${u.name}${hpInfo}</span>`;
    div.addEventListener('mouseenter', ()=>{
      highlightTarget(u.id, aliveList);
    });
    div.addEventListener('click', ()=> confirmPick(u.id));
    el.targetList.appendChild(div);
  });
  if(el.targetList.children.length){ el.targetList.children[0].classList.add('active'); }
}

function highlightTarget(id, aliveList){
  [...el.targetList.children].forEach(c=>c.classList.toggle('active', c.dataset.targetId===id));
  clearTargetHighlights();
  aliveList.forEach(l=>{ const x=document.getElementById('unit-'+l.id); if(x) x.classList.add('targetable'); });
  const uEl = document.getElementById('unit-'+id);
  if(uEl) uEl.classList.add('selected-target');
}

function setupBattlefieldTargetDelegation(){
  const bf = document.getElementById('battlefield');
  bf.addEventListener('mouseover', (e)=>{
    if(!state.targetSelectMode) return;
    const unitEl = e.target.closest('.unit.targetable');
    if(!unitEl) return;
    if(unitEl.classList.contains('selected-target')) return;
    document.querySelectorAll('.unit.targetable').forEach(u=>u.classList.remove('selected-target'));
    unitEl.classList.add('selected-target');
    document.querySelectorAll('#target-list .cmd-item').forEach(c=>{
      c.classList.toggle('active', c.dataset.targetId===unitEl.dataset.id);
    });
  });
  bf.addEventListener('click', (e)=>{
    if(!state.targetSelectMode || !state.activeTargetConfirm) return;
    const unitEl = e.target.closest('.unit.targetable');
    if(!unitEl) return;
    state.activeTargetConfirm(unitEl.dataset.id);
  });
}

function queueAction(action){
  state.queuedActions.push(action);
}

function advanceTurn(){
  clearTargetHighlights();
  state.turnIndex++;
  while(state.turnIndex < state.party.length && !state.party[state.turnIndex].alive){
    state.turnIndex++;
  }
  renderStatus();
  if(state.turnIndex >= state.party.length){
    startResolvePhase();
  } else {
    hideMessageWindow();
    applyTurnStartPassives(currentActor());
    renderStatus();
    renderCommands();
  }
}

function goBackOneTurn(){
  if(state.turnIndex<=0) return;
  state.turnIndex--;
  while(state.turnIndex>0 && !state.party[state.turnIndex].alive){
    state.turnIndex--;
  }
  state.queuedActions.pop();
  clearTargetHighlights();
  renderStatus();
  hideMessageWindow();
  renderCommands();
}

/* ================= resolve phase ================= */
function pickWeighted(list){
  const total = list.reduce((s,a)=>s+(a.weight||1),0);
  let r = Math.random()*total;
  for(const a of list){
    r -= (a.weight||1);
    if(r<=0) return a;
  }
  return list[list.length-1];
}

async function startResolvePhase(){
  state.phase='resolving';
  el.cmdList.innerHTML = '<div class="cmd-item disabled"><span class="cursor"></span><span>コマンドじっこうちゅう...</span></div>';
  el.targetWindow.classList.add('hidden');
  renderStatus();

  // enemy actions
  state.enemies.filter(e=>e.alive).forEach(en=>{
    const aliveParty = state.party.filter(p=>p.alive);
    if(aliveParty.length===0) return;
    if(en.abilities && en.abilities.length){
      let pick = pickWeighted(en.abilities);
      if(pick.type==='heal-self' && en.hp/en.maxHp>0.85){
        pick = en.abilities.find(a=>a.type==='attack-basic') || pick;
      }
      if(pick.type==='attack-basic'){
        const target = aliveParty[Math.floor(Math.random()*aliveParty.length)];
        state.queuedActions.push({actorId:en.id, isEnemy:true, type:'attack', targetId:target.id});
      } else if(pick.type==='atk-single'){
        const target = aliveParty[Math.floor(Math.random()*aliveParty.length)];
        state.queuedActions.push({actorId:en.id, isEnemy:true, type:'spell', spell:pick, targetId:target.id});
      } else if(pick.type==='atk-all'){
        state.queuedActions.push({actorId:en.id, isEnemy:true, type:'spell', spell:pick});
      } else if(pick.type==='heal-self'){
        state.queuedActions.push({actorId:en.id, isEnemy:true, type:'spell', spell:pick, targetId:en.id});
      }
    } else {
      const target = aliveParty[Math.floor(Math.random()*aliveParty.length)];
      state.queuedActions.push({actorId:en.id, isEnemy:true, type:'attack', targetId:target.id});
    }
  });

  // sort by speed desc
  const allUnits = {};
  state.party.forEach(p=>allUnits[p.id]=p);
  state.enemies.forEach(e=>allUnits[e.id]=e);
  const actions = state.queuedActions.slice().sort((a,b)=>{
    const ua = allUnits[a.actorId], ub = allUnits[b.actorId];
    return (ub? ub.spd:0) - (ua? ua.spd:0);
  });
  state.queuedActions = [];

  for(const action of actions){
    if(state.battleOver) break;
    const actor = allUnits[action.actorId];
    if(!actor || !actor.alive) continue;
    await executeAction(action, allUnits);
    if(checkBattleEnd()) { state.battleOver = true; break; }
  }

  if(!state.battleOver){
    nextRound();
  }
}

function resolveTarget(action, actor, allUnits){
  let target = allUnits[action.targetId];
  if(target && target.alive) return target;
  const pool = actor.isEnemy ? state.party.filter(p=>p.alive) : state.enemies.filter(e=>e.alive);
  if(pool.length===0) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

async function executeAction(action, allUnits){
  const actor = allUnits[action.actorId];
  if(action.type==='defend'){
    setMessage(`${actor.name}は みをまもっている!`);
    actor.defending = true;
    await sleep(700);
    return;
  }
  if(action.type==='attack'){
    const target = resolveTarget(action, actor, allUnits);
    if(!target){ return; }
    setMessage(`${actor.name}の こうげき!`);
    await animateAttack(actor.id, target.id, !actor.isEnemy);
    let dmg = Math.max(1, Math.round(actor.atk*(0.85+Math.random()*0.4) - target.def*(target.defending?1.6:1)));
    const miss = Math.random() < 0.05;
    if(miss){
      popDamage(target.id, 'MISS', 'miss');
      setMessage(`${actor.name}の こうげきは はずれた!`);
      await sleep(500);
      return;
    }
    target.hp = Math.max(0, target.hp - dmg);
    popDamage(target.id, dmg, null);
    updateHpBarsOnly();
    setMessage(`${target.name}に ${dmg}の ダメージ!`);
    await sleep(450);
    if(target.hp<=0){
      target.alive = false;
      setMessage(`${target.name}を たおした!`);
      await animateDeath(target.id);
      await sleep(300);
    } else {
      await applyPassiveOnHit(target, dmg, actor);
    }
    return;
  }
  if(action.type==='spell'){
    const sp = action.spell;
    if(actor.mp < sp.mp){
      setMessage(`${actor.name}は MPが たりない!`);
      await sleep(600);
      return;
    }
    actor.mp -= sp.mp;
    setMessage(`${actor.name}は ${sp.name}を となえた!`);
    await animateCast(actor.id, EFFECT_COLORS[sp.name]);
    if(sp.type==='atk-single'){
      const target = resolveTarget(action, actor, allUnits);
      if(!target) return;
      let dmg = Math.max(1, Math.round(sp.power*(0.85+Math.random()*0.3)));
      target.hp = Math.max(0, target.hp - dmg);
      spawnImpactBurst(target.id, EFFECT_COLORS[sp.name]);
      popDamage(target.id, dmg, null);
      updateHpBarsOnly();
      setMessage(`${target.name}に ${dmg}の ダメージ!`);
      await sleep(450);
      if(target.hp<=0){
        target.alive=false;
        setMessage(`${target.name}を たおした!`);
        await animateDeath(target.id);
        await sleep(300);
      } else {
        await applyPassiveOnHit(target, dmg, actor);
      }
    } else if(sp.type==='heal-single'){
      const target = allUnits[action.targetId];
      if(!target) return;
      const heal = Math.round(sp.power*(0.9+Math.random()*0.2));
      target.hp = Math.min(target.maxHp, target.hp+heal);
      spawnImpactBurst(target.id, EFFECT_COLORS[sp.name]);
      popDamage(target.id, '+'+heal, 'heal');
      renderStatus();
      setMessage(`${target.name}の HPが ${heal} かいふくした!`);
      await sleep(500);
    } else if(sp.type==='heal-all'){
      const targets = state.party.filter(p=>p.alive);
      for(const target of targets){
        const heal = Math.round(sp.power*(0.9+Math.random()*0.2));
        target.hp = Math.min(target.maxHp, target.hp+heal);
        spawnImpactBurst(target.id, EFFECT_COLORS[sp.name]);
        popDamage(target.id, '+'+heal, 'heal');
        await sleep(150);
      }
      renderStatus();
      setMessage(`${actor.name}の ${sp.name}で なかまぜんいんが かいふくした!`);
      await sleep(450);
    } else if(sp.type==='atk-all'){
      const targets = actor.isEnemy ? state.party.filter(p=>p.alive) : state.enemies.filter(e=>e.alive);
      for(const target of targets){
        let dmg = Math.max(1, Math.round(sp.power*(0.85+Math.random()*0.3)));
        target.hp = Math.max(0, target.hp - dmg);
        spawnImpactBurst(target.id, EFFECT_COLORS[sp.name]);
        popDamage(target.id, dmg, null);
        updateHpBarsOnly();
        if(target.hp<=0){
          target.alive=false;
          await animateDeath(target.id);
        } else {
          await applyPassiveOnHit(target, dmg, actor);
        }
        await sleep(250);
      }
      setMessage(`${actor.name}の ${sp.name}が ぜんたいを おそった!`);
      await sleep(400);
    } else if(sp.type==='heal-self'){
      const heal = Math.round(sp.power*(0.9+Math.random()*0.2));
      actor.hp = Math.min(actor.maxHp, actor.hp+heal);
      spawnImpactBurst(actor.id, EFFECT_COLORS[sp.name]);
      popDamage(actor.id, '+'+heal, 'heal');
      updateHpBarsOnly();
      setMessage(`${actor.name}は じぶんを かいふくした! ${heal} かいふく!`);
      await sleep(500);
    } else if(sp.type==='buff-def'){
      const target = allUnits[action.targetId];
      if(!target) return;
      spawnImpactBurst(target.id, EFFECT_COLORS[sp.name]);
      target.def += 4;
      popDamage(target.id, 'DEF UP', 'heal');
      setMessage(`${target.name}の ぼうぎょりょくが あがった!`);
      await sleep(500);
    }
    updateHpBarsOnly();
    return;
  }
  if(action.type==='tech'){
    const tech = action.tech;
    if(actor.mp < tech.mp){
      setMessage(`${actor.name}は MPが たりない!`);
      await sleep(600);
      return;
    }
    actor.mp -= tech.mp;
    setMessage(`${actor.name}の ${tech.name}!`);
    if(tech.type==='tech-atk-single'){
      const target = resolveTarget(action, actor, allUnits);
      if(!target) return;
      await animateAttack(actor.id, target.id, !actor.isEnemy);
      let dmg = Math.max(1, Math.round(actor.atk*tech.mult*(0.85+Math.random()*0.3) - target.def*(target.defending?1.6:1)));
      target.hp = Math.max(0, target.hp - dmg);
      spawnImpactBurst(target.id, EFFECT_COLORS[tech.name]);
      popDamage(target.id, dmg, null);
      updateHpBarsOnly();
      setMessage(`${target.name}に ${dmg}の ダメージ!`);
      await sleep(450);
      if(target.hp<=0){
        target.alive=false;
        setMessage(`${target.name}を たおした!`);
        await animateDeath(target.id);
        await sleep(300);
      }
    } else if(tech.type==='tech-atk-all'){
      const targets = state.enemies.filter(e=>e.alive);
      for(const target of targets){
        await animateAttack(actor.id, target.id, !actor.isEnemy);
        let dmg = Math.max(1, Math.round(actor.atk*tech.mult*(0.85+Math.random()*0.3) - target.def*(target.defending?1.6:1)));
        target.hp = Math.max(0, target.hp - dmg);
        spawnImpactBurst(target.id, EFFECT_COLORS[tech.name]);
        popDamage(target.id, dmg, null);
        updateHpBarsOnly();
        if(target.hp<=0){
          target.alive=false;
          await animateDeath(target.id);
        }
        await sleep(250);
      }
      setMessage(`${actor.name}の ${tech.name}が てき ぜんたいを おそった!`);
      await sleep(400);
    }
    updateHpBarsOnly();
    return;
  }
}

async function applyPassiveOnHit(target, dmg, attacker){
  if(target.isEnemy || target.hp<=0) return;
  if(target.kind==='knight'){
    await sleep(500);
    const heal = Math.max(1, Math.round(dmg/4));
    target.hp = Math.min(target.maxHp, target.hp+heal);
    popDamage(target.id, '+'+heal, 'heal');
    updateHpBarsOnly();
    setMessage(`${target.name}は ダメージから ${heal} かいふくした!`);
    await sleep(450);
  } else if(target.kind==='supermonk' || target.kind==='monk'){
    if(attacker && attacker.alive && attacker.isEnemy){
      const ratio = target.kind==='supermonk' ? 2 : 4;
      const counter = Math.max(1, Math.round(dmg/ratio));
      attacker.hp = Math.max(0, attacker.hp-counter);
      setMessage(`${target.name}の カウンター!`);
      await animateAttack(target.id, attacker.id, !target.isEnemy);
      popDamage(attacker.id, counter, null);
      updateHpBarsOnly();
      setMessage(`${attacker.name}に ${counter}の ダメージ!`);
      await sleep(400);
      if(attacker.hp<=0){
        attacker.alive=false;
        setMessage(`${attacker.name}を たおした!`);
        await animateDeath(attacker.id);
        await sleep(300);
      }
      updateHpBarsOnly();
    }
  }
}

function regenMp(p){
  if(!p || p.maxMp<=0 || p.mp>=p.maxMp) return;
  const pct = 0.20 + Math.random()*0.10; // 約25%程度(20〜30%のランダム)
  const amt = Math.round(p.maxMp*pct);
  if(amt<=0) return;
  const before = p.mp;
  p.mp = Math.min(p.maxMp, p.mp+amt);
  const healed = p.mp-before;
  if(healed>0){
    popDamage(p.id, '+'+healed, 'mpheal');
  }
}

function applyTurnStartPassives(p){
  if(!p) return;
  regenMp(p);
  if(p.kind==='whitemage' && p.alive && p.hp<p.maxHp){
    setTimeout(()=>{
      if(!p.alive) return;
      const heal = 3;
      p.hp = Math.min(p.maxHp, p.hp+heal);
      popDamage(p.id, '+'+heal, 'heal');
      updateHpBarsOnly();
    }, 500);
  }
}

function checkBattleEnd(){
  const partyAlive = state.party.some(p=>p.alive);
  const enemiesAlive = state.enemies.some(e=>e.alive);
  if(!partyAlive){ endBattle(false); return true; }
  if(!enemiesAlive){ endBattle(true); return true; }
  return false;
}

function nextRound(){
  state.round++;
  state.turnIndex = 0;
  while(state.turnIndex < state.party.length && !state.party[state.turnIndex].alive){
    state.turnIndex++;
  }
  state.party.forEach(p=>p.defending=false);
  state.phase='command';
  if(state.turnIndex >= state.party.length){
    // shouldn't happen (means all dead, handled above)
    return;
  }
  renderStatus();
  hideMessageWindow();
  applyTurnStartPassives(currentActor());
  renderStatus();
  renderCommands();
}

function endBattle(victory){
  state.battleOver = true;
  state.phase='over';
  el.cmdList.innerHTML='';
  setTimeout(()=>{
    el.endOverlay.classList.remove('hidden');
    if(!victory){
      el.endTitle.textContent = 'ぜんめつしました';
      el.endDesc.textContent = '';
      el.endBtn.textContent = 'はじめから';
      state.endAction = 'restart';
    } else if(state.round===3){
      classChangeParty();
      el.endTitle.textContent = 'へいわが おとずれた';
      el.endDesc.textContent = 'ついに くらやみのしはいしゃを たおし、へいわが おとずれた!';
      el.endBtn.textContent = 'はじめから';
      state.endAction = 'restart';
    } else {
      const changed = classChangeParty();
      el.endTitle.textContent = 'しょうり!';
      let desc = 'てきを ぜんめつさせた!';
      if(changed.length){
        desc += '\n\nクラスチェンジした!\n' + changed.map(c=>`・${c.from}→${c.to}`).join('\n');
      }
      el.endDesc.textContent = desc;
      el.endBtn.textContent = 'つぎのたたかいへ';
      state.endAction = 'continue';
    }
  }, 500);
}

el.endBtn.addEventListener('click', ()=>{
  el.endOverlay.classList.add('hidden');
  if(state.endAction==='restart'){
    state.party = PARTY_TEMPLATE();
    state.round = 1;
    startBattle(1);
  } else {
    startBattle(state.round+1);
  }
});

/* ================= boot ================= */
function startBattle(round){
  state.round = round || 1;
  state.enemies = (state.round===3) ? makeBossEncounter() : randomEncounter(state.round);
  state.turnIndex = 0;
  state.queuedActions = [];
  state.battleOver = false;
  const gameEl = document.getElementById('game');
  gameEl.classList.toggle('terrain-castle', state.round===3);
  gameEl.classList.toggle('terrain-desert', state.round>=2 && state.round!==3);
  state.phase='command';
  state.party.forEach(p=>p.defending=false);
  while(state.turnIndex < state.party.length && !state.party[state.turnIndex].alive){
    state.turnIndex++;
  }
  renderUnits();
  renderStatus();
  const names = state.enemies.map(e=>e.name).join('、');
  setMessage(`${names}が あらわれた!`);
  setTimeout(()=>{
    if(state.turnIndex < state.party.length){
      hideMessageWindow();
      applyTurnStartPassives(currentActor());
      renderStatus();
      renderCommands();
    }
  }, 3000);
}

spawnStars();
setupBattlefieldTargetDelegation();
startBattle(1);

})();
</script>
